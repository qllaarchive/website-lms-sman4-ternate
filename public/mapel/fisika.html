<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#31237e">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#221653">
<meta name="color-scheme" content="light dark">
<title>Fisika LMS Kelas X — SMAN 4 Ternate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=EB+Garamond:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/lms.css">
<style>
/* ============ Fisika — palet violet (override lms.css) ============ */
:root{
  --navy:#31237e; --navy2:#4634a3; --navy-ink:#eae6ff; --blue:#6d4df2;
  --e1:#0d9488; --e1bg:#dcf4f2; --e1line:#68cdb9;
  --e2:#1f6fe5; --e2bg:#e6efff; --e2line:#b7cff7;
  --e3:#8b5cf6; --e3bg:#f1eaff; --e3line:#d3bcfa;
  --e4:#15803d; --e4bg:#e3f6ea; --e4line:#ade0c0;
  --lab:#6d4df2; --labbg:#efeaff; --labline:#cfc2fb;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#221653; --navy2:#382a86; --blue:#8b6bff;
  --e1:#2dd4bf; --e1bg:#0f2e2b; --e1line:#1d5250;
  --e2:#6aa3ff; --e2bg:#12264a; --e2line:#22406f;
  --e3:#a78bfa; --e3bg:#2b1643; --e3line:#4c2a75;
  --e4:#4ade80; --e4bg:#0f2e1e; --e4line:#1d5236;
  --lab:#a789ff; --labbg:#231a44; --labline:#3d2f73;
}}
:root[data-theme="dark"]{
  --navy:#221653; --navy2:#382a86; --blue:#8b6bff;
  --e1:#2dd4bf; --e1bg:#0f2e2b; --e1line:#1d5250;
  --e2:#6aa3ff; --e2bg:#12264a; --e2line:#22406f;
  --e3:#a78bfa; --e3bg:#2b1643; --e3line:#4c2a75;
  --e4:#4ade80; --e4bg:#0f2e1e; --e4line:#1d5236;
  --lab:#a789ff; --labbg:#231a44; --labline:#3d2f73;
}
</style>
<script>
/* Samakan tema dengan portal (lms_theme) sebelum paint. */
(function(){ var t; try{ t = localStorage.getItem("lms_theme"); }catch(e){}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
<link rel="stylesheet" href="../assets/mobile.css">
</head>
<body>
<header class="top">
  <div class="top-in gut">
    <div class="brand">
      <a class="go-home" href="../index.html" aria-label="Balik ke beranda" title="Balik ke beranda" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>

      <svg class="brand-logo" viewBox="0 0 74 66" aria-hidden="true">
        <rect x="4" y="6" width="66" height="54" rx="10" fill="#fff" opacity=".14"/>
        <rect x="4" y="6" width="66" height="54" rx="10" fill="none" stroke="#ffc531" stroke-width="3"/>
        <path d="M14 48 Q28 14 44 40 T64 22" fill="none" stroke="#ffc531" stroke-width="4" stroke-linecap="round"/>
        <circle cx="44" cy="40" r="4" fill="#fff"/>
        <text x="14" y="30" font-size="15" fill="#dfe8ff" font-family="serif" font-style="italic">∑x</text>
      </svg>
      <div>
        <h1 id="brandTitle">LMS <b>Kelas X</b></h1>
        <div class="sub" id="brandSub">Kelas X · SMAN 4 Ternate</div>
        <div class="moto" id="brandMoto"></div>
      </div>
    </div>
    <button class="user" data-act="go" data-v="set">
      <span class="av" id="userAv">M</span>
      <span class="who"><b id="userName">Murid Kelas X</b><small id="userMeta">Fase E · Semester Genap</small></span>
    </button>
  </div>
  <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 1100 176" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="physGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#31237e"/>
            <stop offset=".5" stop-color="#2a1a5e"/>
            <stop offset="1" stop-color="#1e104a"/>
          </linearGradient>
          <radialGradient id="atomGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#6d4df2" stop-opacity="0.9"/>
            <stop offset="0.6" stop-color="#6d4df2" stop-opacity="0"/>
          </radialGradient>
          <pattern id="star" width="4" height="4" patternUnits="userSpaceOnUse">
            <path d="M0 2L1 0L3 2L1 4L0 2Z" fill="#fff" opacity="0.5"/>
          </pattern>
        </defs>
        <rect width="1100" height="176" fill="url(#physGrad)"/>
        <rect width="1100" height="176" fill="url(#star)"/>
        <!-- Bintang di angkasa -->
        <g opacity="0.6">
          <circle cx="80" cy="25" r="1.5" fill="#c7a7ff"/>
          <circle cx="200" cy="30" r="1" fill="#a78bfa"/>
          <circle cx="340" cy="20" r="1.5" fill="#c7a7ff"/>
          <circle cx="460" cy="35" r="1" fill="#a78bfa"/>
          <circle cx="580" cy="18" r="1.5" fill="#c7a7ff"/>
          <circle cx="700" cy="28" r="1" fill="#a78bfa"/>
          <circle cx="850" cy="22" r="1.5" fill="#c7a7ff"/>
          <circle cx="980" cy="32" r="1" fill="#a78bfa"/>
          <circle cx="1060" cy="15" r="1.2" fill="#c7a7ff"/>
        </g>
        <!-- Atom model (intelligent / scientific) -->
        <g transform="translate(350,90)">
          <circle cx="0" cy="0" r="38" fill="url(#atomGlow)" opacity="0.5"/>
          <circle cx="0" cy="0" r="38" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
          <circle cx="62" cy="30" r="38" fill="none" stroke="#8b6bff" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
          <circle cx="-58" cy="38" r="38" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
          <circle cx="-62" cy="-28" r="38" fill="none" stroke="#8b6bff" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
          <circle cx="56" cy="-36" r="38" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
          <!-- Partikel elektron -->
          <circle cx="0" cy="0" r="2.5" fill="#fff">
            <animate attributeName="cy" values="-12;12;-12" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="cx" values="0;8;0" dur="3s" repeatCount="indefinite"/>
          </circle>
        </g>
        <!-- Ekuasi sahta (smart / science) -->
        <g opacity="0.7" font-family="EB Garamond, serif" font-style="italic" text-anchor="middle">
          <text x="780" y="95" font-size="38" fill="#f0d8ff" letter-spacing="2">E = mc<tspan font-size="24" dy="6">2</tspan></text>
          <text x="780" y="125" font-size="28" fill="#c7a7ff" letter-spacing="3" opacity="0.85">∑ ma</text>
        </g>
        <!-- Eksperimen lab sederhana -->
        <g opacity="0.6">
          <circle cx="280" cy="140" r="4" fill="#6d4df2"/>
          <circle cx="310" cy="138" r="3" fill="#a78bfa"/>
          <line x1="300" y1="60" x2="300" y2="120" stroke="#6d4df2" stroke-width="1.5" opacity="0.5"/>
          <rect x="220" y="40" width="160" height="18" rx="4" fill="#4634a3" opacity="0.7"/>
          <rect x="300" y="140" width="22" height="20" rx="3" fill="#6d4df2"/>
          <rect x="302" y="160" width="18" height="12" rx="2" fill="#6d4df2"/>
        </g>
        <rect width="1100" height="176" fill="url(#fade)"/>
      </svg>
    </div>
</header>

<div class="app gut">
  <aside class="side">
    <nav class="nav" id="nav" aria-label="Menu utama"></nav>
    <div class="side-moto" id="sideMoto"></div>
    <div class="side-note" id="sideNote"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script src="../assets/lms-boot.js" data-mapel="fisika" data-name="Fisika"></script>
</body>
</html>
