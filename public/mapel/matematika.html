<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0e2a6e">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1d4d">
<meta name="color-scheme" content="light dark">
<title>Matematika LMS Kelas X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=EB+Garamond:wght@400;500;600&display=swap">
<style>
/* ============ Matematika LMS Kelas X — kerangka visual ============ */
:root{
  color-scheme:light;
  --bg:#eef3fb; --card:#fff; --ink:#18213d; --muted:#5a6683; --line:#d9e2f1; --soft:#f5f8fe;
  --navy:#0e2a6e; --navy2:#163a8f; --navy-ink:#e4ecff; --blue:#1f6fe5; --sun:#ffc531;
  --e1:#e0532e; --e1bg:#ffe9e2; --e1line:#f7c2b0;      /* Bilangan */
  --e2:#1f6fe5; --e2bg:#e6efff; --e2line:#b7cff7;      /* Aljabar & Fungsi */
  --e3:#1f9d55; --e3bg:#e3f6ea; --e3line:#ade0c0;      /* Geometri */
  --e4:#9333ea; --e4bg:#f5e9ff; --e4line:#d9bdf7;      /* Analisis Data & Peluang */
  --lab:#7446e8; --labbg:#efe9ff; --labline:#cdbcf7;
  --good:#15803d; --goodbg:#dcfce7; --bad:#d92d2d; --badbg:#fde4e4;
  --shadow:0 1px 2px rgba(20,40,90,.06),0 6px 18px rgba(20,40,90,.06);
  --display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --card:#131d33; --ink:#e7edf9; --muted:#9eabc8; --line:#24314f; --soft:#18233c;
  --navy:#0a1d4d; --navy2:#122d70; --blue:#4a8dff;
  --e1:#ff8a5c; --e1bg:#3a1d14; --e1line:#6b3524;
  --e2:#6aa3ff; --e2bg:#12264a; --e2line:#22406f;
  --e3:#46c97c; --e3bg:#0f2e1e; --e3line:#1d5236;
  --e4:#c084fc; --e4bg:#2b1643; --e4line:#4c2a75;
  --lab:#a789ff; --labbg:#231a44; --labline:#3d2f73;
  --good:#4ade80; --goodbg:#0f2f1c; --bad:#ff7b7b; --badbg:#3a1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1222; --card:#131d33; --ink:#e7edf9; --muted:#9eabc8; --line:#24314f; --soft:#18233c;
  --navy:#0a1d4d; --navy2:#122d70; --blue:#4a8dff;
  --e1:#ff8a5c; --e1bg:#3a1d14; --e1line:#6b3524;
  --e2:#6aa3ff; --e2bg:#12264a; --e2line:#22406f;
  --e3:#46c97c; --e3bg:#0f2e1e; --e3line:#1d5236;
  --e4:#c084fc; --e4bg:#2b1643; --e4line:#4c2a75;
  --lab:#a789ff; --labbg:#231a44; --labline:#3d2f73;
  --good:#4ade80; --goodbg:#0f2f1c; --bad:#ff7b7b; --badbg:#3a1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 15px/1.55 var(--body);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
input,textarea,select{font-size:16px}
button,a,[role="button"],.tile,.opt,.qopt,.gcard,.labcard,.ucard,.ql button,.tabs button,.chip,.g-card,.dslot{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banner */
.top{background:var(--navy);color:#fff;position:relative;overflow:hidden;min-height:176px}
.top-in{display:flex;align-items:center;gap:18px;max-width:1500px;margin:0 auto;padding-block:14px;position:relative;z-index:2;min-height:176px}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.brand-logo{width:74px;height:66px;flex-shrink:0}
.go-home{align-self:center;flex-shrink:0;order:-1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#dfe8ff;text-decoration:none;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:transform .18s var(--ease),background-color .18s var(--ease),box-shadow .18s var(--ease)}.go-home svg{width:19px;height:19px;display:block}.go-home:hover{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.38);transform:translateY(-1.5px)}.go-home:active{transform:translateY(0) scale(.93)}.go-home:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.brand h1{font-size:clamp(28px,4vw,50px);font-weight:800;letter-spacing:.2px;color:#fff}
.brand h1 b{color:var(--sun)}
.brand .sub{font:700 clamp(13px,1.4vw,18px) var(--body);color:#dfe8ff}
.brand .moto{font:700 clamp(15px,1.7vw,23px) var(--display);color:#fff;font-style:italic;margin-top:2px}
.brand .moto i{color:var(--sun);font-style:normal;padding:0 8px}
.scene{position:absolute;top:0;right:0;bottom:0;width:min(74%,1100px);z-index:1;overflow:hidden;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.scene::before{content:"";position:absolute;inset:0 auto 0 0;width:170px;background:linear-gradient(90deg,var(--navy),rgba(14,42,110,0));z-index:1}
.brand h1,.brand .sub,.brand .moto{text-shadow:0 2px 8px rgba(5,15,45,.55)}
.user{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));margin-left:auto;display:flex;align-items:center;gap:12px;background:#fff;color:#18213d;border-radius:14px;padding:10px 14px;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:3;border:0;cursor:pointer;text-align:left;max-width:270px}
.user .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 16px var(--display);flex-shrink:0}
.user b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user small{color:#5a6683;font-weight:700}
@media (max-width:820px){
  .top{display:flex;flex-direction:column;min-height:0}
  .top-in{min-height:0;order:1;padding-block:12px}
  .scene{position:relative;width:100%;height:96px;order:2}
  .scene::before{display:none}
  .user{position:static;margin-left:auto}
}
@media (max-width:560px){.brand-logo{width:52px;height:46px}.go-home{width:34px;height:34px}.go-home svg{width:17px;height:17px}.user .who{display:none}.user{padding:8px}}

/* App frame */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding-block:18px 40px}
.side{background:var(--navy);border-radius:var(--r);padding:12px;align-self:start;position:sticky;top:max(12px,env(safe-area-inset-top,0px));color:var(--navy-ink)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:#d7e2ff;font:700 15px var(--body);cursor:pointer;text-align:left;transition:background .16s var(--ease)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(31,111,229,.4)}
.nav svg{width:22px;height:22px;flex-shrink:0}
.side-moto{margin-top:18px;padding:14px 8px 4px;font:800 25px/1 var(--display);color:#fff;transform:rotate(-5deg)}
.side-moto span{display:block;color:var(--sun);margin-left:18px}
.side-note{margin:14px 8px 6px;font:700 12px/1.45 var(--body);color:#9db4e8;border-top:1px dashed rgba(255,255,255,.2);padding-top:10px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:0 44px}
  .side{position:sticky;top:0;z-index:30;padding:6px 8px;box-shadow:0 6px 16px rgba(10,29,77,.3)}
  .nav{flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:0}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;white-space:nowrap;padding:9px 13px;font-size:14px;background:rgba(255,255,255,.08);border-radius:999px;scroll-snap-align:center}
  .nav button.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(31,111,229,.45)}
  .side-moto,.side-note{display:none}
}
main{min-width:0}

/* Generik */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font:800 14px var(--body);cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;line-height:1.2;transition:transform .16s var(--ease),filter .16s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.lab{background:var(--lab)}
.btn.green{background:var(--e3)}
.btn.orange{background:var(--e1)}
.btn.violet{background:var(--e4)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font:800 12px var(--body);background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.pill.e1{background:var(--e1bg);color:var(--e1);border-color:var(--e1line)}
.pill.e2{background:var(--e2bg);color:var(--e2);border-color:var(--e2line)}
.pill.e3{background:var(--e3bg);color:var(--e3);border-color:var(--e3line)}
.pill.e4{background:var(--e4bg);color:var(--e4);border-color:var(--e4line)}
.pill.good{background:var(--goodbg);color:var(--good);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:24px;color:var(--navy2)}
:root[data-theme="dark"] .sec-h h2{color:var(--ink)}
.sec-h .ic{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:18px}
.sec-h .right{margin-left:auto}
select,input[type=text],input[type=number],textarea{font:600 16px var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font:800 13px var(--body);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.back{align-self:flex-start;background:none;border:0;color:var(--blue);font:800 14px var(--body);cursor:pointer;padding:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:800 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft)}
td.num{font-variant-numeric:tabular-nums;text-align:right}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}
@media (max-width:1240px){.home{grid-template-columns:minmax(0,1fr)}}
.welcome{display:flex;gap:18px;align-items:center;padding:16px 18px;background:linear-gradient(100deg,var(--e2bg),var(--card) 70%);flex-wrap:wrap}
.welcome .globe{font-size:54px;line-height:1;flex-shrink:0}
.welcome h2{font-size:clamp(23px,2.6vw,32px);color:var(--navy2)}
:root[data-theme="dark"] .welcome h2{color:var(--ink)}
.welcome .txt{flex:1 1 300px;min-width:0}
.quote{border:2px dashed var(--e3line);border-radius:14px;padding:10px 16px;font:700 italic 17px/1.25 var(--display);color:var(--navy2);max-width:240px;text-align:center}
:root[data-theme="dark"] .quote{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:800 14px/1.2 var(--body);text-align:center;color:var(--ink);box-shadow:var(--shadow);position:relative;transition:transform .18s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:32px;line-height:1}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{border-radius:var(--r);border:1.5px solid var(--line);overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.col.e1{border-color:var(--e1line)}.col.e2{border-color:var(--e2line)}.col.e3{border-color:var(--e3line)}.col.e4{border-color:var(--e4line)}
.col-h{display:flex;gap:12px;align-items:center;padding:12px 14px}
.col.e1 .col-h{background:var(--e1bg)}.col.e2 .col-h{background:var(--e2bg)}.col.e3 .col-h{background:var(--e3bg)}.col.e4 .col-h{background:var(--e4bg)}
.col-h .bub{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:23px;color:#fff;flex-shrink:0;border:3px solid var(--card)}
.col.e1 .bub{background:var(--e1)}.col.e2 .bub{background:var(--e2)}.col.e3 .bub{background:var(--e3)}.col.e4 .bub{background:var(--e4)}
.col-h small{font:800 12px var(--body);color:var(--muted)}
.col-h h3{font-size:18px;overflow-wrap:anywhere}
.col.e1 h3{color:var(--e1)}.col.e2 h3{color:var(--e2)}.col.e3 h3{color:var(--e3)}.col.e4 h3{color:var(--e4)}
.ulist{display:flex;flex-direction:column;gap:8px;padding:10px}
.ucard{display:grid;grid-template-columns:52px minmax(0,1fr) 14px;gap:12px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;position:relative;transition:border-color .16s var(--ease),background .16s var(--ease)}
.ucard .th{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-size:26px;position:relative}
.col.e1 .th{background:var(--e1bg)}.col.e2 .th{background:var(--e2bg)}.col.e3 .th{background:var(--e3bg)}.col.e4 .th{background:var(--e4bg)}
.ucard .no{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;color:#fff;font:800 13px/24px var(--display);text-align:center}
.col.e1 .no{background:var(--e1)}.col.e2 .no{background:var(--e2)}.col.e3 .no{background:var(--e3)}.col.e4 .no{background:var(--e4)}
.ucard h4{font-size:15.5px;overflow-wrap:anywhere}
.ucard p{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ucard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font:700 11.5px var(--body);color:var(--muted)}
.ucard .meta span{white-space:nowrap}
.ucard .chev{color:var(--muted);font-size:18px}
.ucard .done{position:absolute;top:6px;right:8px;font-size:12px}
.mini{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.mini i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .5s var(--ease)}
.res-ic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center;font:800 11.5px/1.25 var(--body);overflow-wrap:anywhere}
.res-ic button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:10px;color:var(--ink)}
.res-ic .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--labbg)}
/* rail */
.rail{display:flex;flex-direction:column;gap:16px}
.ring-wrap{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex-shrink:0}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--e3);border-radius:99px;transition:width .6s var(--ease)}
.stat2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.stat2 div+div{border-left:1px solid var(--line);padding-left:14px}
.stat2 b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.cal ul{list-style:none;margin:0;padding:0}
.cal li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.cal li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.bad{background:var(--bad)}.dot.e1{background:var(--e1)}.dot.e2{background:var(--e2)}.dot.e3{background:var(--e3)}.dot.e4{background:var(--e4)}
.ql{list-style:none;margin:0;padding:0}
.ql button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px 4px;border-radius:8px;cursor:pointer;font:700 14px var(--body);color:var(--ink);text-align:left}
.ql span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--soft)}
.rail-moto{background:linear-gradient(180deg,var(--e3bg),var(--card));text-align:center;padding:20px 16px;font:800 25px/1.05 var(--display);color:var(--navy2)}
:root[data-theme="dark"] .rail-moto{color:var(--ink)}

/* Unit header & tabs */
.uhead{border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.uhead.e1{background:var(--e1bg);border:1.5px solid var(--e1line)}
.uhead.e2{background:var(--e2bg);border:1.5px solid var(--e2line)}
.uhead.e3{background:var(--e3bg);border:1.5px solid var(--e3line)}
.uhead.e4{background:var(--e4bg);border:1.5px solid var(--e4line)}
.uhead .big{font-size:50px;line-height:1}
.uhead h2{font-size:29px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font:800 14px var(--body);cursor:pointer;white-space:nowrap;color:var(--ink);transition:background .16s var(--ease)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tpcard{border-left:5px solid var(--blue);padding:14px 16px;border-radius:12px;background:var(--soft)}
.tpcard .code{font:800 13px var(--body);color:var(--blue)}
.ex{font-style:italic;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:6px}
.model{font-size:16.5px;line-height:1.75;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.model .hl{font-weight:700;background:var(--sun);color:#2a1f00;border-radius:4px;padding:0 3px}
.focus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.focus-grid{grid-template-columns:minmax(0,1fr)}}
.focus-grid div{background:var(--soft);border-radius:12px;padding:12px;border:1px solid var(--line)}
.focus-grid b{display:block;font:800 14px var(--display);color:var(--blue)}
.meet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.meet{grid-template-columns:minmax(0,1fr)}}
.meet .card ul{margin:8px 0 0;padding-left:18px}
.meet .card li{margin:3px 0}
.meet .card.ok{border-color:var(--good);background:linear-gradient(180deg,var(--goodbg),var(--card) 40%)}
.chart{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.chart .r{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px;font-weight:700}
.chart .r .b{display:block;height:18px;border-radius:6px;background:var(--e2)}
.chart .r .v{font-variant-numeric:tabular-nums;text-align:right}
.chart .r .tr{display:block;background:var(--soft);border-radius:6px;overflow:hidden}

/* Kuis */
.q{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.q h4{font:800 16px/1.4 var(--body);margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;cursor:pointer;font:700 14.5px var(--body);color:var(--ink);width:100%;transition:border-color .16s var(--ease),transform .16s var(--ease)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.fb.good{background:var(--goodbg);color:var(--good)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb span{color:var(--ink)}
.result{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.result .sc{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums}
.timer{font:800 18px var(--display);font-variant-numeric:tabular-nums;background:var(--navy);color:#fff;border-radius:10px;padding:4px 12px}
.timer.warn{background:var(--bad)}
.numb-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.numb-in input{width:140px;font-family:var(--mono)}

/* Lab */
.labhero{background:linear-gradient(120deg,var(--labbg),var(--card));border:1.5px solid var(--labline);border-radius:var(--r);padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.labhero h2{font-size:32px;color:var(--lab)}
.labgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.labgrid{grid-template-columns:minmax(0,1fr)}}
.labcard{display:flex;gap:14px;align-items:flex-start;padding:16px;text-align:left;cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);color:var(--ink);width:100%;transition:border-color .16s var(--ease),transform .16s var(--ease)}
.labcard .li{width:60px;height:60px;border-radius:16px;background:var(--labbg);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.labcard h3{font-size:20px}
canvas.lab{width:100%;background:#0d1230;border-radius:14px;border:1px solid var(--line);display:block}
.labctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.labctl label{font:800 13px var(--body);color:var(--muted);display:flex;gap:8px;align-items:center}
.labout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.labout div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.labout b{display:block;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.seq{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.seq li{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.seq li .n{width:28px;height:28px;border-radius:50%;background:var(--labbg);color:var(--lab);display:grid;place-items:center;font:800 14px var(--display);flex-shrink:0}
.seq li .tx{flex:1;min-width:0;font-weight:600}
.seq li.ok{border-color:var(--good);background:var(--goodbg)}
.seq li.no{border-color:var(--bad);background:var(--badbg)}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--line);background:var(--soft);border-radius:6px;width:30px;height:22px;cursor:pointer;font-size:12px;line-height:1;color:var(--ink)}

/* Gim */
.ghero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px;border-radius:var(--r);background:linear-gradient(120deg,#2a1b6e,#6a2fd6 55%,#d83a8c);color:#fff}
.ghero h2{font-size:32px;color:#fff}.ghero p{color:#efe9ff;font-weight:600}
.gh-ic{font-size:64px;line-height:1}
.gh-total{background:rgba(255,255,255,.15);border-radius:16px;padding:12px 18px;text-align:center}
.gh-total b{display:block;font:800 40px var(--display);color:#ffd84d}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:transform .18s var(--ease)}
.gcard > span:last-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard b{font:800 18px var(--display)}
.gcard small{color:var(--muted);font-weight:600;font-size:12.5px}
.gicon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--labbg);flex-shrink:0}
.gstars{color:#f5b301;font-size:16px;letter-spacing:1px}.gstars i{color:var(--line);font-style:normal}.gstars em{font-style:normal;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:0}
.ghead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:var(--r)}
.ghead h2{font-size:28px}
.gbox{border-radius:18px;overflow:hidden;background:#140d33;color:#fff;box-shadow:0 10px 30px rgba(20,10,60,.35)}
.ghud{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding:10px 14px;background:#22165a;font:800 14px var(--body)}
.ghud .warn{color:#ff8a7a}
.garena{padding:18px;min-height:320px;background:radial-gradient(120% 100% at 80% 0,#3b1f8f 0,#140d33 60%)}
.garena.g-ok{animation:gok .45s}
.garena.g-bad{animation:gbad .45s}
@keyframes gok{0%{box-shadow:inset 0 0 0 0 #46c97c}40%{box-shadow:inset 0 0 0 6px #46c97c}100%{box-shadow:inset 0 0 0 0 #46c97c}}
@keyframes gbad{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.g-kicker{display:block;font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#bfb2ff;margin:6px 0}
.g-big{font:800 clamp(20px,3.4vw,32px)/1.25 var(--display);margin:6px 0 12px}
.g-prompt{font:800 18px/1.35 var(--display);margin-bottom:10px}.g-prompt small{color:#bfb2ff;font-size:13px}
.g-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g-opts.g-col{grid-template-columns:minmax(0,1fr)}
.g-opts button{border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;padding:12px 14px;font:800 15px var(--body);cursor:pointer;text-align:left;transition:transform .1s,background .15s}
.g-opts button.no,.g-opts button[disabled]{opacity:.35;text-decoration:line-through}
.g-prog{display:block;margin-top:10px;color:#bfb2ff;font-weight:800;font-size:13px}
.gend{text-align:center;padding:30px 18px;display:grid;gap:8px;justify-items:center}
.gend-ic{font-size:64px}.gend h3{font-size:28px;color:#fff}
.gend-stars{font-size:44px;color:#ffd84d;letter-spacing:4px}.gend-stars i{color:rgba(255,255,255,.2);font-style:normal}
.g-rocket{display:grid;grid-template-columns:90px minmax(0,1fr);gap:18px;align-items:stretch}
.g-track{position:relative;border-radius:14px;background:linear-gradient(#0b0730,#2b1a7a);min-height:300px;overflow:hidden}
.g-track::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:22px 26px;opacity:.35}
.g-ship{position:absolute;left:50%;transform:translateX(-50%);font-size:40px;transition:bottom .5s var(--ease)}
.g-moon{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:30px}
.g-mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.g-mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.g-card{aspect-ratio:4/3;border-radius:14px;border:0;cursor:pointer;background:linear-gradient(135deg,#6a2fd6,#d83a8c);color:#fff;font:800 13px/1.25 var(--body);padding:8px;display:grid;place-items:center;transition:transform .2s var(--ease)}
.g-card span{overflow-wrap:anywhere}
.g-card:not(.up) span{font-size:30px}
.g-card.up{background:#fff;color:#2a1b6e}
.g-card.done{background:#c9f7da;color:#0f5132;cursor:default}
.g-bubble{background:#fff;color:#2a1b6e;border-radius:18px 18px 18px 4px;padding:12px 16px;font:800 17px var(--display);margin-bottom:8px}
.g-paper{background:#fdfaf0;color:#2b2b2b;border-radius:12px;padding:16px;font:500 16px/1.7 Georgia,serif}
.g-paper b{display:block;font:800 13px var(--body);letter-spacing:.2em;color:#a33;margin-bottom:4px}
.g-sent{cursor:pointer;border-radius:4px;padding:1px 2px}
.g-sent.pick{background:var(--sun);color:#2a1f00}
.g-sent.okx{background:var(--goodbg);outline:2px solid var(--good)}

/* Arena gim — canvas ekspedisi & dot plot */
#exp,#dbp{display:block;max-width:100%;height:auto;margin:0 auto;background:#0d1230;border-radius:12px}
.dcode{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dcode .qin{width:96px}
.drow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dslot{min-width:86px;padding:8px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:grid;gap:2px;justify-items:center}
.dslot small{font:800 11px var(--body);letter-spacing:.06em;color:#bfb2ff;text-transform:uppercase}
.dslot b{font:800 20px var(--display)}
.dslot.on{border-color:#ffd84d;background:rgba(255,216,77,.15)}
.dslot.bad{border-color:#ff5d8f;background:rgba(255,93,143,.15)}
.dbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{min-width:44px;padding:6px 10px;border-radius:99px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:800 14px var(--body);cursor:pointer}
.chip.used{opacity:.3;cursor:default}
.labquiz{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.labquiz .lq-q{font:800 15px var(--body);flex:1;min-width:180px}
.labquiz .lq-fb{font:800 13px var(--body);width:100%;min-height:18px}
.lqbtn{padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:800 13px var(--body)}
.lqbtn.ok{border-color:var(--good);background:var(--goodbg)}
.lqbtn.no{border-color:var(--bad);background:var(--badbg)}

/* Chat / bot */
.chat{display:flex;flex-direction:column;gap:10px;height:min(500px,60dvh);overflow-y:auto;overscroll-behavior:contain;padding:16px;background:var(--soft);border-radius:14px;border:1px solid var(--line)}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.5;white-space:pre-line}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

/* Modal / toast / sendbox */
.sendbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--e3bg);border:1px solid var(--e3line);font-size:14px}
.sendbox.off{background:var(--soft);border-color:var(--line)}
.modal{position:fixed;inset:0;background:rgba(8,15,35,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(460px,100%);padding:22px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:tin .25s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.anim-in{animation:fin .25s var(--ease)}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Forum, grades, ebook */
.forum-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.ava{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 15px var(--display);flex-shrink:0}
.ava.guru{background:var(--e1)}
.eb-page{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:340px;font:400 16.5px/1.75 "EB Garamond",Georgia,serif;white-space:pre-line}
.eb-page h3{font:800 24px var(--display);margin-bottom:10px;white-space:normal}
.grade-pick{display:flex;gap:8px;flex-wrap:wrap}
.grade-pick button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font:800 13.5px var(--body);cursor:pointer}
.grade-pick button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.formula{font-family:var(--mono);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:2px 8px;font-size:14px;white-space:nowrap}

/* Elemen strip kecil */
.estrip{display:flex;gap:8px;flex-wrap:wrap}
.estrip .pill{cursor:default}

/* Komponen aplikasi (unit, kuis, lab, tugas) */
.uhead{align-items:flex-start}
.uhead .mini{flex:1 1 100%}
.uhead .row{width:100%}
.uemoji{font-size:46px;line-height:1}
.tpuh .tpcard{margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;border-radius:99px;padding:5px 12px;font:700 13px var(--body);background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.chip.e1{background:var(--e1bg);border-color:var(--e1line);color:var(--e1)}
.chip.e2{background:var(--e2bg);border-color:var(--e2line);color:var(--e2)}
.chip.e3{background:var(--e3bg);border-color:var(--e3line);color:var(--e3)}
.chip.e4{background:var(--e4bg);border-color:var(--e4line);color:var(--e4)}
.mlist{display:flex;flex-direction:column;gap:6px;margin:8px 0 0;color:var(--muted);font-weight:600}
.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft);margin-top:12px}
.task p{margin-top:6px}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;font:800 14px var(--body);margin-top:10px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.refl-q{margin-bottom:14px}
.refl-q b{display:block;margin-bottom:6px}
.refl-q textarea{min-height:64px}
.unitpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.unitpick button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:800 14px var(--body);cursor:pointer;color:var(--ink)}
.unitpick button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.res{padding:12px 14px;border-radius:12px;margin-top:12px;font-weight:700}
.res.ok{background:var(--goodbg);color:var(--good);border:1px solid var(--good)}
.res.warn{background:var(--e1bg);color:var(--e1);border:1px solid var(--e1line)}
.qhead{margin-bottom:6px}
.qtext{font:800 16.5px/1.5 var(--body)}
.qopts{display:grid;gap:8px;margin-top:12px}
.qopt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;cursor:pointer;font:700 14.5px var(--body);color:var(--ink);width:100%;transition:border-color .16s var(--ease),transform .16s var(--ease)}
.qopt.ok{border-color:var(--good);background:var(--goodbg)}
.qopt.no{border-color:var(--bad);background:var(--badbg)}
.qopt.dim{opacity:.55}
.qopt[disabled]{cursor:default}
.qin{font:700 16px var(--mono);width:200px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.qfb{margin-top:10px}
.qfb .ok{color:var(--good);font:800 14px var(--body)}
.qfb .no{color:var(--bad);font:800 14px var(--body)}
.qend{padding:26px 18px;text-align:center;border-radius:14px;display:grid;gap:6px;justify-items:center;background:var(--soft);border:1.5px solid var(--line)}
.qend.good{background:var(--goodbg);border-color:var(--good)}
.qend.bad{background:var(--badbg);border-color:var(--bad)}
.qscore{font:800 52px/1 var(--display);font-variant-numeric:tabular-nums}
.g-again{background:#fff;color:#2a1b6e;border-radius:12px}
.hint-chip{font-size:13px;color:var(--muted)}

@media (hover:hover) and (pointer:fine){
.nav button:hover{background:rgba(255,255,255,.08)}
.btn:hover{filter:brightness(1.07)}
.tile:hover{transform:translateY(-2px);border-color:var(--blue)}
.ucard:hover{border-color:var(--blue);background:var(--soft)}
.res-ic button:hover{background:var(--soft)}
.ql button:hover{background:var(--soft)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.labcard:hover{border-color:var(--lab);transform:translateY(-2px)}
.gcard:hover{transform:translateY(-2px);border-color:var(--lab)}
.g-opts button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.g-sent:hover{background:#ffe9a8}
.forum-row:hover{background:var(--soft)}
.qopt:hover:not([disabled]){border-color:var(--blue)}
}
@media (max-width:560px){
  .top-in{padding-block:10px}
  .brand h1{font-size:26px}
  .brand .moto{font-size:15px}
  .app{gap:12px;padding-block:10px 44px}
  .pad{padding:14px}
  .stack{gap:12px}
  .sec-h h2{font-size:20px}
  .sec-h .ic{width:30px;height:30px;font-size:16px}
  .welcome{padding:14px;gap:12px}
  .welcome .globe{font-size:36px}
  .welcome h2{font-size:21px}
  .quote{max-width:none;text-align:left;font-size:15px;padding:8px 14px}
  .tiles{gap:8px}
  .tile{padding:12px 6px 10px;font-size:13.5px}
  .tile .ti{font-size:27px}
  .uhead{padding:14px;gap:10px}
  .uhead .big{font-size:34px}
  .uhead h2{font-size:22px}
  .model{padding:14px 15px;font-size:15.5px}
  .labhero{padding:15px;gap:12px}
  .labhero h2{font-size:23px}
  .ghero{padding:15px;gap:12px}
  .ghero h2{font-size:23px}
  .gh-ic{font-size:44px}
  .ghud{padding:8px 12px;font-size:13px}
  .garena{padding:12px;min-height:250px}
  .g-big{font-size:21px}
  .g-prompt{font-size:16px}
  .g-opts{grid-template-columns:minmax(0,1fr)}
  .gend{padding:24px 12px}
  .chat{height:min(440px,60dvh);padding:12px}

/* ================= PENGATURAN GURU =================
   ID Web App Google Apps Script diatur lewat panel admin (?gs=).
   Tidak ada nilai default yang dikodekan di sini. */
function gsNorm(v){
  v = String(v || "").trim();
  const m = v.match(/\/macros\/s\/([^\/\s]+)/);
  return m ? m[1] : v;
}
function load(){ try{ const r = localStorage.getItem(LS_KEY); if(r) Object.assign(D, JSON.parse(r)); }catch(e){}
  if(!D.gs) D.gs = gsNorm(""); }
function loadFromUrl(){
  try{
    var params = new URLSearchParams(window.location.search);
    var gs = params.get("gs");
    if(gs){ D.gs = gsNorm(gs); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){} gsProgres(); }
function U(n){ if(!D.u[n]) D.u[n] = { materi:false, diag:0, form:0, quiz:0, refl:false, proj:false, meet:[false,false,false] }; return D.u[n]; }
function theme(){ if(D.tema) document.documentElement.dataset.theme = D.tema; else delete document.documentElement.dataset.theme; }

/* progres */
const unitFlags = n => { const u = U(n); return [u.materi, u.diag>0, u.form>0, u.quiz>0, u.refl, u.proj, u.meet.every(Boolean)].filter(Boolean).length; };
const UNIT_TOT = 7;
function progAll(){ let d=0; for(let n=1;n<=12;n++) d+=unitFlags(n);
  if(D.ex.uts>0)d++; if(D.ex.uas>0)d++; if(D.ex.rem>0)d++;
  return { d, t: 12*UNIT_TOT+3 }; }
function progUnit(n){ return Math.round(unitFlags(n)/UNIT_TOT*100); }
function allScores(n){ const u=U(n); return [u.diag,u.form,u.quiz].filter(x=>x>0); }
function avgUnit(n){ const a=allScores(n); return a.length? Math.round(a.reduce((s,x)=>s+x,0)/a.length) : 0; }

/* toast */
let toastT = null;
function toast(msg){ const old = document.querySelector(".toast"); if(old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2600); }

function renderNav(){
  $("nav").innerHTML = NAV.map(([id,ic,lb]) =>
    `<button data-nav="${id}" class="${navActive(VIEW.name)===id?"on":""}"><span>${ic}</span>${lb}</button>`).join("");
  $("nav").querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { go(b.dataset.nav); play("klik"); });
}
let soundOn = true;
function play(kind){ if(!soundOn) return; try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = play.ctx || (play.ctx = new AC());
    const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    const f = { klik:660, benar:880, salah:220, bintang:1046 }[kind] || 660;
    o.frequency.value = f; o.type = kind==="salah" ? "square" : "sine";
    g.gain.setValueAtTime(.05, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+.16);
    o.start(); o.stop(ctx.currentTime+.16);
  }catch(e){} }
function render(){
  renderNav();
  try{ gcRun(); }catch(e){}
  const m = $("main");
  const fn = VIEWS[VIEW.name] || VIEWS.home;
  m.innerHTML = fn(VIEW.arg, VIEW.arg2);
  m.classList.remove("anim-in"); void m.offsetWidth; m.classList.add("anim-in");
  (BIND[VIEW.name] || (()=>{}))(VIEW.arg, VIEW.arg2);
}

function nextUnitN(){ for(let n=1;n<=12;n++) if(unitFlags(n) < UNIT_TOT) return n; return 12; }
function avgAll(){ const a = []; for(let n=1;n<=12;n++) a.push(...allScores(n));
  if(!a.length) return "—"; return Math.round(a.reduce((s,x)=>s+x,0)/a.length); }
function ringSVG(pct){
  const r = 42, c = 2*Math.PI*r;
  return `<circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--good)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="56" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Baloo 2">${pct}%</text>`;
}
function ucard(u){
  const pr = progUnit(u.n), done = pr >= 100;
  const best = avgUnit(u.n);
  return `<button class="ucard" data-unit="${u.n}">
    <span class="th"><span class="no">${u.n}</span>${u.emoji}</span>
    <span><h4>${esc(u.title)}</h4><p>${esc(u.desc)}</p>
      <span class="meta"><span>📘 ${u.tp.length} TP</span><span>⏱ 12 JP</span>${best?`<span>⭐ ${best}</span>`:""}</span>
      <span class="mini"><i style="width:${pr}%"></i></span></span>
    <span class="chev">${done?"✅":"›"}</span></button>`;
}
function calItems(){
  const items = [
    ["bad","Tenggat","Proyek unit berjalan dikumpulkan setiap Jumat"],

  return items.map(([k,w,t]) => `<li><span class="dot ${k}"></span><span><b class="small">${w}</b><br><span class="small muted">${t}</span></span></li>`).join("");
}

function mountQuiz(boxId, items, opt){
  const box = $(boxId); if(!box) return;
  box.innerHTML = `<button class="btn" id="q-start">▶ ${opt.done?"Ulangi":"Mulai"}</button>`;
  box.querySelector("#q-start").onclick = () => { play("klik"); startQuiz(box, items, opt); };
}
function startQuiz(box, items, opt){
  if(!box) return;
  items = items.map(shuffleQ);
  let i = 0, correct = 0, picked = null, answered = false;
  const score = () => Math.round(correct / items.length * 100);
  function draw(){
    if(i >= items.length){
      const s = score(), pass = s >= KKTP;
      box.innerHTML = `<div class="qend ${pass?"good":"bad"}">
        <div class="qscore">${s}</div><b>${pass?"Lulus! 🎉":"Belum tuntas"}</b>
        <p class="small">${correct} dari ${items.length} benar · KKTP ${KKTP}</p>
        ${pass?"":`<p class="small">Skor terbaikmu tersimpan untuk remedial — coba lagi setelah belajar ulang.</p>`}
        <div class="row" style="margin-top:12px"><button class="btn" id="q-retry">↻ Ulangi</button>
        <button class="btn ghost" id="q-close">Selesai</button></div></div>`;
      box.querySelector("#q-retry").onclick = () => { i=0; correct=0; draw(); };
      box.querySelector("#q-close").onclick = () => opt.onDone && opt.onDone(s);
      gsNilai(opt, s);
      opt.onScore && opt.onScore(s);
      return;
    }
    const q = items[i];
    box.innerHTML = `<div class="qhead"><span class="eyebrow">${esc(opt.title||"Soal")} · ${i+1}/${items.length}</span></div>
      <div class="qtext">${i+1}. ${esc(q.q)}</div>
      ${q.num ? `<div class="row" style="margin-top:12px"><input class="qin" id="q-num" inputmode="decimal" placeholder="Jawaban angka…">
          <button class="btn" id="q-chk">Periksa</button></div><div id="q-fb" class="qfb"></div>`
        : `<div class="qopts">${q.o.map((t,k)=>`<button class="qopt" data-k="${k}">${String.fromCharCode(65+k)}. ${esc(t)}</button>`).join("")}</div>
           <div id="q-fb" class="qfb"></div>`}
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="q-next" disabled>${i===items.length-1?"Lihat hasil":"Soal berikutnya →"}</button></div>`;
    const next = box.querySelector("#q-next");
    if(q.num){
      const check = () => {
        if(answered) return; answered = true;
        const v = parseFloat(box.querySelector("#q-num").value.replace(",", "."));
        const ok = !isNaN(v) && Math.abs(v - q.ans) < 0.011;
        if(ok) correct++;
        box.querySelector("#q-fb").innerHTML = `<span class="${ok?"ok":"no"}">${ok?"✔ Benar!":"✘ Salah"} — jawaban: ${q.ans}</span>`
          + (q.w?`<div class="small muted" style="margin-top:6px">${esc(q.w)}</div>`:"");
        play(ok?"benar":"salah"); next.disabled = false;
      };
      box.querySelector("#q-chk").onclick = check;
      box.querySelector("#q-num").addEventListener("keydown", e => { if(e.key==="Enter") check(); });
    } else {
      box.querySelectorAll(".qopt").forEach(b => b.onclick = () => {
        if(answered) return; answered = true;
        const k = +b.dataset.k, ok = k === q.a;
        if(ok) correct++;
        box.querySelectorAll(".qopt").forEach((x,xi) => {
          if(xi === q.a) x.classList.add("ok");
          else if(xi === k) x.classList.add("no");
          else x.classList.add("dim");
          x.disabled = true;
        });
        play(ok?"benar":"salah");
        box.querySelector("#q-fb").innerHTML = `<span class="${ok?"ok":"no"}">${ok?"✔ Benar!":"✘ Salah"}</span>`
          + (q.w?`<div class="small muted" style="margin-top:6px">${esc(q.w)}</div>`:"");
        next.disabled = false;
      });
    }
    next.onclick = () => { i++; picked = null; answered = false; draw(); };
  }
  draw();
}

/* ================= GAME ================= */
let gameCleanup = [];
function gcRun(){ gameCleanup.forEach(f => { try{ f(); }catch(e){} }); gameCleanup = []; }
function starsOf(gid, li){ return (D.g[gid] && D.g[gid].stars && D.g[gid].stars[li]) || 0; }
function starsGame(gid){ let s = 0; for(let li = 0; li < 3; li++) s += starsOf(gid, li); return s; }
function totalStars(){ let s = 0; GAMES.forEach(g => s += starsGame(g.id)); return s; }
function unlocked(gid, li){ return li === 0 || starsOf(gid, li-1) > 0; }
function putStars(gid, li, st){
  const prev = starsOf(gid, li);
  if(st > prev){ D.g[gid] = D.g[gid] || {}; D.g[gid].stars = D.g[gid].stars || {}; D.g[gid].stars[li] = st; save(); }
  return prev;
}
function gameCard(g){
  const stars = starsGame(g.id);
  const done = [0,1,2].filter(li => starsOf(g.id, li) > 0).length;
  return `<button class="gcard" data-game="${g.id}">
    <span class="gicon">${g.emoji}</span>
    <span><b>${esc(g.name)}</b><small>${esc(g.desc)}</small>
      <span class="gstars">${[0,1,2].map(i => i < Math.round(stars/3) ? "★" : '<i>★</i>').join("")}
      <em>${done}/3 level · ${stars}/9★</em></span></span></button>`;
}
VIEWS.game = (id) => {
  if(!id){
    const total = GAMES.length * 3 * 3;
    return `<div class="stack">
      <div class="ghero"><span class="gh-ic">🎮</span>
        <div><h2>Gim Edukatif Matematika</h2>
          <p>3 gim buatan LMS · 3 level tiap gim · soal selaras unit &amp; elemen CP Kelas X.</p></div>
        <div class="gh-total"><b>${totalStars()}</b><span class="small">bintang dari ${total}</span></div></div>
      <div class="ggrid">${GAMES.map(gameCard).join("")}</div></div>`;
  }
  const g = GAMES.find(x => x.id === id) || GAMES[0];
  const stars = starsGame(g.id);
  const levels = [0,1,2].map(li => {
    const s = starsOf(g.id, li), on = unlocked(g.id, li);
    return `<button class="ucard" ${on ? `data-lv="${li}"` : 'disabled style="opacity:.5"'}>
      <span class="th"><span class="no">${li+1}</span>${g.emoji}</span>
      <span><h4>Level ${li+1}</h4><p>${on ? "Tantangan siap dimainkan" : "Selesaikan level sebelumnya dulu"}</p>
        <span class="gstars">${[0,1,2].map(k => k < s ? "★" : '<i>★</i>').join("")}</span></span>
      <span class="chev">${s ? "✅" : on ? "▶" : "🔒"}</span></button>`; }).join("");
  return `<div class="stack">
    <div class="ghead" style="background:var(--labbg)">
      <span class="gh-ic" style="font-size:44px">${g.emoji}</span>
      <div><button class="btn ghost sm" data-gback="1">← Semua gim</button>
        <h2 style="margin-top:6px">${esc(g.name)}</h2>
        <p class="muted small">${esc(g.desc)} · bintang: ${stars}/9</p></div></div>
    ${levels}
    <div class="gbox" id="gbox" hidden></div></div>`;
};
BIND.game = (id) => {
  document.querySelectorAll("[data-game]").forEach(b => b.onclick = () => { play("klik"); go("game", b.dataset.game); });
  document.querySelector("[data-gback]")?.addEventListener("click", () => go("game"));
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => {
    play("klik");
    const box = $("gbox"); if(!box) return;
    box.hidden = false;
    mountGame(box, id, +b.dataset.lv);
    if(box.scrollIntoView) try{ box.scrollIntoView({ behavior:"smooth", block:"nearest" }); }catch(e){}
  });
};
function mountGame(box, gid, li){
  gcRun();
  box.hidden = false;
  if(gid === "ekspedisi") mountEkspedisi(box, li);
  else if(gid === "harmoni") mountHarmoni(box, li);
  else mountBoxplot(box, li);
}
function gameEnd(box, gid, li, opt){
  gcRun();
  putStars(gid, li, opt.st);
  const hasNext = li < 2;
  box.innerHTML = `<div class="gend">
    <span class="gend-ic">${opt.st >= 2 ? "🏆" : opt.st >= 1 ? "🎖️" : "🚀"}</span>
    <div class="gend-stars">${[0,1,2].map(k => k < opt.st ? "★" : '<i>★</i>').join("")}</div>
    <h3>${esc(opt.title)}</h3>
    <p class="small" style="color:#cfc4ff">${esc(opt.detail)}</p>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn" id="g-again">↻ Ulangi</button>
      ${opt.st > 0 && hasNext ? `<button class="btn" id="g-next" style="background:#22c55e;color:#052e16">Level berikutnya →</button>` : ""}
      <button class="btn ghost" id="g-exit">Kembali</button></div></div>`;
  play(opt.st ? "bintang" : "salah");
  const again = box.querySelector("#g-again"), exit = box.querySelector("#g-exit"), next = box.querySelector("#g-next");
  if(again) again.onclick = () => mountGame(box, gid, li);
  if(exit) exit.onclick = () => go("game", gid);
  if(next) next.onclick = () => mountGame(box, gid, li+1);
}

/* ---- Gim 1: Ekspedisi Eksponen (petualangan 7 pos) ---- */
function mountEkspedisi(box, li){
  const P = GPARM.ekspedisi[li];
  const bank = [GQUEST.ekspedisi.r1, GQUEST.ekspedisi.r2, GQUEST.ekspedisi.r3][li];
  const qs = shuffle(bank).slice(0, P.need);
  const NAMES = ["Rimba Pangkat", "Air Terjun Akar", "Puncak Ilmiah"];
  const SKY = [["#8ec9ff", "#ffe3b3"], ["#7ec2ff", "#c9ecff"], "#0d1230"][li];
  let qi = 0, lives = P.lives, time = P.time, miss = 0, over = false;
  let px = 52, tx = 52, walking = false, fbMsg = "", fbOk = true, shake = 0;
  const pos = i => 52 + i * 88;
  function paint(){
    const cv = box.querySelector("#exp"); if(!cv) return;
    const g = ctxOf(cv); if(!g) return;
    const W = 640, H = 200; cv.width = W; cv.height = H;
    const grd = g.createLinearGradient(0, 0, 0, H);
    if(li === 2){ grd.addColorStop(0, "#1a1f4e"); grd.addColorStop(1, "#3b2f7e"); }
    else { grd.addColorStop(0, SKY[0] || "#8ec9ff"); grd.addColorStop(1, SKY[1] || "#ffe3b3"); }
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    g.fillStyle = li === 2 ? "#e8e6ff" : "#ffd84d";
    g.beginPath(); g.arc(572, 40, 20, 0, 7); g.fill();
    g.fillStyle = "rgba(40,30,90,.5)";
    g.beginPath(); g.moveTo(0, 150); g.lineTo(110, 76); g.lineTo(240, 150); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(210, 155); g.lineTo(360, 64); g.lineTo(520, 155); g.closePath(); g.fill();
    g.fillStyle = "#6b4f2e"; g.fillRect(0, 150, W, 50);
    g.fillStyle = "#8a6a3e";
    for(let x = 6; x < W; x += 26) g.fillRect(x, 152, 14, 4);
    for(let i = 0; i < P.need; i++){
      const x = pos(i), done = i < qi, cur = i === qi;
      g.strokeStyle = done ? "#46c97c" : cur ? "#ffd84d" : "rgba(255,255,255,.45)";
      g.lineWidth = 3;
      g.beginPath(); g.moveTo(x, 150); g.lineTo(x, 106); g.stroke();
      g.fillStyle = done ? "#46c97c" : cur ? "#ffd84d" : "rgba(255,255,255,.6)";
      g.beginPath(); g.moveTo(x, 106); g.lineTo(x + 24, 114); g.lineTo(x, 122); g.closePath(); g.fill();
      g.fillStyle = "#fff"; g.font = "800 12px sans-serif"; g.textAlign = "center";
      g.fillText(done ? "✓" : String(i + 1), x, 142);
    }
    const dx = shake ? (Math.random() * 8 - 4) : 0;
    g.font = "28px sans-serif"; g.textAlign = "center";
    g.fillText("🥾", px + dx, 148);
  }
  function hud(){
    const q = qs[Math.min(qi, qs.length - 1)];
    const opts = q.o.map((t, i) =>
      `<button data-exp="${i}" ${walking || over ? "disabled" : ""}>${esc(t)}</button>`).join("");
    box.innerHTML = `<div class="ghud"><span>🏕️ ${esc(NAMES[li])} · Pos ${Math.min(qi + 1, P.need)}/${P.need}</span>
        <span class="g-prog" style="margin:0">❤️ ${lives} · ⏱ ${time}s</span></div>
      <div class="garena">
        <div class="g-prompt" style="text-align:center">${esc(q.p)}</div>
        <canvas id="exp"></canvas>
        <div class="g-opts" style="margin-top:10px">${opts}</div>
        <div class="g-prog" style="text-align:center;min-height:18px">${fbMsg
          ? `<span style="color:${fbOk ? "#7dffa8" : "#ff8a7a"}">${fbMsg}</span>`
          : "Pilih jawaban benar — pemain akan berjalan ke pos berikutnya."}</div>
      </div>`;
    box.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => answer(+b.dataset.exp));
    paint();
  }
  function answer(k){
    if(over || walking) return;
    const q = qs[qi];
    if(k === q.a){
      qi++; play("benar"); fbMsg = "✔ Gerbang terbuka! Maju ke pos berikutnya…"; fbOk = true;
      if(qi >= P.need){ finish(); return; }
      tx = pos(qi); walking = true;
      hud();
    } else {
      lives--; miss++; shake = 6; play("salah");
      fbMsg = "✘ Gerbang tetap tertutup — coba lagi!"; fbOk = false;
      if(lives <= 0){ finish(); return; }
      hud();
    }
  }
  function finish(){
    if(over) return;
    over = true;
    if(qi >= P.need){
      const st = miss === 0 ? 3 : miss <= 1 ? 2 : 1;
      gameEnd(box, "ekspedisi", li, { st: st, title: P.need + "/" + P.need + " pos tercapai!",
        detail: miss === 0 ? "Ekspedisi tanpa tersesat — puncak direbut!" : miss + " kali tersesat di jalan." });
    } else {
      gameEnd(box, "ekspedisi", li, { st: 0, title: time <= 0 ? "Waktu ekspedisi habis!" : "Perbekalan nyawa habis!",
        detail: qi + "/" + P.need + " pos tercapai. Rute sudah di peta — coba sekali lagi!" });
    }
  }
  hud();
  const iv = setInterval(() => {
    if(over) return;
    time--;
    if(time <= 0){ finish(); return; }
    hud();
  }, 1000);
  gameCleanup.push(() => clearInterval(iv));
  const mv = setInterval(() => {
    if(over) return;
    if(shake > 0) shake--;
    const d = tx - px;
    if(Math.abs(d) < 2){ px = tx; if(walking){ walking = false; fbMsg = ""; hud(); } }
    else px += d > 0 ? Math.min(4, d) : Math.max(-4, d);
    paint();
  }, 30);
  gameCleanup.push(() => clearInterval(mv));
  const kd = e => {
    if(over || walking) return;
    if(e.key === "1" || e.key === "2" || e.key === "3"){ answer(+e.key - 1); }
  };
  document.addEventListener("keydown", kd);
  gameCleanup.push(() => document.removeEventListener("keydown", kd));
}

/* ---- Gim 2: Detektif Harmoni (SPLDV kasus kota) ---- */
function mountHarmoni(box, li){
  const P = GPARM.harmoni[li];
  const kase = GQUEST.harmoni[li];
  let miss = 0, done = false, lives = P.lives;
  function draw(){
    box.innerHTML = `<div class="ghud"><span>🕵️ Kasus ${li + 1}/3 · ${esc(kase.name)}</span>
        <span class="g-prog" style="margin:0" id="hcount">❤️ ${lives} · ✘ ${miss}</span></div>
      <div class="garena">
        <div class="g-paper" style="margin-bottom:10px"><b>LAPORAN KASUS</b>${esc(kase.s)}</div>
        <div class="g-paper" style="margin-bottom:10px"><b>PETUNJUK 1 · MODEL</b>${esc(kase.e1)}</div>
        <div class="g-paper" style="margin-bottom:12px"><b>PETUNJUK 2 · MODEL</b>${esc(kase.e2)}</div>
        <div class="dcode">x = <input class="qin" id="hx" inputmode="numeric" placeholder="…">
          y = <input class="qin" id="hy" inputmode="numeric" placeholder="…">
          <button class="btn" id="hchk">🔍 Periksa Alibi</button></div>
        <div id="hfb" class="g-prog" style="text-align:center;min-height:34px"></div>
      </div>`;
    const chk = () => {
      if(done) return;
      const inX = box.querySelector("#hx"), inY = box.querySelector("#hy");
      const fb = box.querySelector("#hfb");
      const xv = Number(String(inX.value).trim().replace(",", "."));
      const yv = Number(String(inY.value).trim().replace(",", "."));
      if(isNaN(xv) || isNaN(yv) || inX.value.trim() === "" || inY.value.trim() === ""){
        fb.innerHTML = `<span style="color:#ff8a7a">Masukkan dulu dugaan x dan y (bilangan bulat).</span>`;
        play("salah"); return;
      }
      const p1 = kase.v1[0]*xv + kase.v1[1]*yv, p2 = kase.v2[0]*xv + kase.v2[1]*yv;
      const ok1 = Math.abs(p1 - kase.v1[2]) < 1e-6, ok2 = Math.abs(p2 - kase.v2[2]) < 1e-6;
      if(ok1 && ok2){
        done = true; play("benar");
        fb.innerHTML = `<span style="color:#7dffa8">✔ ALIBI COCOK — ${esc(kase.ok)}</span>
          <span style="display:block;margin-top:4px;color:#bfb2ff">Catatan detektif: ${esc(kase.note)}</span>`;
        box.querySelectorAll("input, button").forEach(el => { el.disabled = true; });
        const st = miss === 0 ? 3 : miss <= 2 ? 2 : 1;
        const t = setTimeout(() => {
          if(li < 2){
            putStars("harmoni", li, st);
            mountGame(box, "harmoni", li + 1);
          } else {
            gameEnd(box, "harmoni", li, { st: st, title: "Kota Harmoni pulih! 🏙️",
              detail: miss === 0 ? "Tiga kasus terpecahkan tanpa satu pun dugaan salah." : miss + " dugaan salah sepanjang misi." });
          }
        }, 1800);
        gameCleanup.push(() => clearTimeout(t));
        return;
      }
      miss++; lives--; play("salah");
      fb.innerHTML = `<span style="color:#ff8a7a">✘ Alibi belum cocok — Petunjuk 1: dapat ${p1} (harus ${kase.v1[2]}) ${ok1?"✔":"✗"} · Petunjuk 2: dapat ${p2} (harus ${kase.v2[2]}) ${ok2?"✔":"✗"}</span>`;
      if(lives <= 0){
        gameEnd(box, "harmoni", li, { st: 0, title: "Perbekalan detektif habis!",
          detail: "Kasus ini butuh dugaan lebih teliti. Baca lagi tiap kalimat petunjuknya." });
        return;
      }
      const cnt = box.querySelector("#hcount");
      if(cnt) cnt.textContent = "❤️ " + lives + " · ✘ " + miss;
    };
    box.querySelector("#hchk") && (box.querySelector("#hchk").onclick = chk);
    box.querySelectorAll("#hx, #hy").forEach(inp => inp.addEventListener("keydown", e => { if(e.key === "Enter") chk(); }));
  }
  draw();
}

/* ---- Gim 3: Detektif Data (susun ringkasan box plot) ---- */
function mountBoxplot(box, li){
  const P = GPARM.boxplot[li];
  const kase = GQUEST.boxplot[li];
  const data = kase.data.slice();
  const n = data.length;
  function medarr(a){ const m = a.length; return m % 2 ? a[(m-1)/2] : (a[m/2-1] + a[m/2]) / 2; }
  const ans = { min: data[0], q1: medarr(data.slice(0, (n-1)/2)), med: medarr(data),
                q3: medarr(data.slice((n+1)/2)), max: data[n-1] };
  const SLOTS = [["min","min"],["Q1","q1"],["median","med"],["Q3","q3"],["maks","max"]];
  let slots = [null, null, null, null, null];
  let chips = shuffle(data).map(v => ({ v: v, off: false }));
  let active = 0, lives = P.lives, done = false, miss = 0;
  let wrong = {};
  function draw(){
    box.innerHTML = `<div class="ghud"><span>📦 Kasus ${li + 1}/3 · Susun 5 Ringkasan</span>
        <span class="g-prog" style="margin:0">❤️ ${lives} · ✘ ${miss}</span></div>
      <div class="garena">
        <p class="g-prompt" style="color:#efe9ff;margin:0 0 10px">${esc(kase.s)}</p>
        <canvas id="dbp"></canvas>
        <div class="drow">${SLOTS.map((s, i) =>
          `<button class="dslot${wrong[i] ? " bad" : ""}${active === i ? " on" : ""}" data-slot="${i}">
            <small>${s[0]}</small><b>${slots[i] === null ? "?" : slots[i]}</b></button>`).join("")}</div>
        <div class="dbank">${chips.map((c, i) => c.off
          ? `<span class="chip used">${c.v}</span>`
          : `<button class="chip" data-chip="${i}">${c.v}</button>`).join("")}</div>
        <div class="row" style="justify-content:center;margin-top:10px">
          <button class="btn" id="bchk">🔓 Verifikasi Zona</button>
          <button class="btn ghost" id="brst">↻ Ulangi isi</button></div>
        <div id="bfb" class="g-prog" style="text-align:center;min-height:30px">
          Klik slot lalu klik angka — isi min, Q1, median, Q3, maks.</div>
      </div>`;
    paint();
    box.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => {
      if(done) return;
      active = +b.dataset.slot; play("klik"); draw();
    });
    box.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
      if(done) return;
      const c = chips[+b.dataset.chip];
      if(!c || c.off) return;
      c.off = true;
      slots[active] = c.v;
      wrong = {};
      play("klik");
      let nx = slots.findIndex(x => x === null);
      if(nx >= 0) active = nx;
      draw();
    });
    box.querySelector("#brst").onclick = () => {
      slots = [null,null,null,null,null];
      chips = shuffle(data).map(v => ({ v: v, off: false }));
      wrong = {}; active = 0; play("klik"); draw();
    };
    box.querySelector("#bchk").onclick = check;
  }
  function paint(){
    const cv = box.querySelector("#dbp"); if(!cv) return;
    const g = ctxOf(cv); if(!g) return;
    const W = 640, H = 110; cv.width = W; cv.height = H;
    g.fillStyle = "#0d1230"; g.fillRect(0, 0, W, H);
    const mn = data[0], mx = data[n-1];
    const sx = v => 40 + (v - mn) / ((mx - mn) || 1) * (W - 80);
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(30, 70); g.lineTo(W - 30, 70); g.stroke();
    const tally = {};
    data.forEach(v => { tally[v] = (tally[v] || 0) + 1; });
    Object.keys(tally).forEach(v => {
      const x = sx(+v);
      for(let c = 0; c < tally[v]; c++){
        g.beginPath(); g.arc(x, 70 - c * 15, 5.5, 0, 7);
        g.fillStyle = "#8f7bff"; g.fill();
        g.lineWidth = 1.5; g.strokeStyle = "#cfc4ff"; g.stroke();
      }
      g.fillStyle = "#cfe0ff"; g.font = "11px sans-serif"; g.textAlign = "center";
      g.fillText(v, x, 94);
    });
  }
  function check(){
    if(done) return;
    if(slots.some(x => x === null)){
      box.querySelector("#bfb").innerHTML = `<span style="color:#ff8a7a">Lengkapi semua 5 slot dulu.</span>`;
      play("salah"); return;
    }
    wrong = {};
    let ok = true;
    SLOTS.forEach((s, i) => {
      if(slots[i] !== ans[s[1]]){ wrong[i] = 1; ok = false; }
    });
    if(ok){
      done = true; play("benar");
      box.querySelector("#bfb").innerHTML =
        `<span style="color:#7dffa8">✔ ZONA TERBUKA — ${esc(kase.ok)}</span>
         <span style="display:block;margin-top:4px;color:#bfb2ff">Catatan: ${esc(kase.note)}</span>`;
      const st = lives === 3 ? 3 : lives === 2 ? 2 : 1;
      const t = setTimeout(() => {
        if(li < 2){
          putStars("boxplot", li, st);
          mountGame(box, "boxplot", li + 1);
        } else {
          gameEnd(box, "boxplot", li, { st: st, title: "Zona terakhir terbuka! 📦",
            detail: miss === 0 ? "Tiga kasus data tuntas tanpa kesalahan." : miss + " kali salah di sepanjang misi." });
        }
      }, 1800);
      gameCleanup.push(() => clearTimeout(t));
      draw();
      return;
    }
    miss++; lives--; play("salah");
    if(lives <= 0){
      gameEnd(box, "boxplot", li, { st: 0, title: "Zona tetap terkunci!",
        detail: "Hitung ulang: median = nilai tengah data terurut; Q1/Q3 = median paruh bawah/atas." });
      return;
    }
    box.querySelector("#bfb").innerHTML = `<span style="color:#ff8a7a">✘ Masih ada yang salah — slot merah dihitung ulang. ❤️ tersisa ${lives}</span>`;
    draw();
  }
  draw();
}

      <div class="labhero"><span style="font-size:52px">🧪</span>
        <div><h2>Lab Maya</h2>
          <p class="muted" style="font-weight:600">Eksplorasi langsung: geser parameter, lihat grafik &amp; angkanya berubah. Tandai selesai setelah kamu menemukan polanya.</p></div></div>
      <div class="labgrid">${LABS.map(l => `<button class="labcard" data-lab="${l.id}">
        <span class="li">${l.emoji}</span>
        <span><span class="eyebrow">ELEMEN ${l.el} ${D.lab[l.id]?"· ✅ SELESAI":""}</span>
          <h3>${esc(l.name)}</h3><p class="small muted">${esc(l.desc)}</p></span></button>`).join("")}</div></div>`;
  }
  const l = LABS.find(x => x.id === id) || LABS[0];
  const top = `<div class="labhero" style="padding:16px">
    <button class="btn ghost sm" data-lback="1">← Semua lab</button>
    <div><h2 style="font-size:26px">${l.emoji} ${esc(l.name)}</h2>
      <p class="small muted" style="margin-top:4px">${esc(l.hint)}</p></div></div>`;
  const done = D.lab[l.id] ? `<div class="res ok">✅ Lab ini sudah kamu tandai selesai.</div>` : "";
  const ctl = {

  function grid(g, W, H){

  function drawTrigo(t){

    }

  const bk = EBOOKS.find(x => x.id === id) || EBOOKS[0];

    <div class="sec-h"><span class="ic">${bk.emoji}</span><h2>${esc(bk.title)}</h2>
      <span class="right pill">Hal. ${ebPage+1}/${bk.pages.length}</span></div>

        <button class="btn ghost" id="eb-next" ${ebPage===bk.pages.length-1?"disabled":""}>Berikutnya →</button>

};
BIND.ebook = (id) => {

  $("eb-prev") && ($("eb-prev").onclick = () => { ebPage--; play("klik"); render(); });
  $("eb-done") && ($("eb-done").onclick = () => toast("Halaman ditandai dibaca 📗"));
  const nx = $("eb-next"); if(nx) nx.onclick = () => { ebPage++; play("klik"); render(); };
};

  const p = String(name || "Murid Kelas X").trim().split(/\s+/);
  const a = (p[0] || "M")[0] || "M", b = (p[1] || "")[0] || "";
  return (a + b).toUpperCase();
}
function threads(){
  if(!D.forum){ D.forum = JSON.parse(JSON.stringify(FORUM_SEED)); save(); }

}

BIND.forum = (id) => {
  document.querySelectorAll("[data-ft]").forEach(r => r.onclick = () => { play("klik"); go("forum", r.dataset.ft); });

    const list = threads();

      time:"baru saja", title: ti, body: bo, replies: [] });

  document.querySelector("#f-send")?.addEventListener("click", () => {

/* ================= BOT CHAT ================= */
function botReply(t){
  for(const [re, ans] of BOT_RULES) if(re.test(t)) return ans;
  return BOT_FALLBACK;
}
VIEWS.bot = () => {
  const msgs = D.chat.map(m => `<div class="msg ${m.who==="me"?"me":"bot"}">${esc(m.t)}</div>`).join("");
  const quick = ["rumus kuadrat","kuartil","cara belajar","eksponen","trigonometri"];
  return `<div class="stack">
    <div class="sec-h"><span class="ic">🤖</span><h2>Teman Matematika</h2>
      <span class="right row"><button class="btn ghost sm" id="b-clear">Bersihkan chat</button></span></div>
    <div class="card pad">
      <div class="chat" id="chat">${msgs}</div>
      <div class="row" style="margin-top:12px"><input type="text" id="b-in" placeholder="Tanya apa saja…" style="flex:1;min-width:200px">
        <button class="btn" id="b-send">Kirim</button></div>
      <div class="row" style="margin-top:10px">${quick.map(q=>`<button class="btn ghost sm" data-bq="${q}">${q}</button>`).join("")}</div>
      <p class="small muted" style="margin-top:10px">Aturan jawaban lokal (offline) — cocokkan dengan kata kunci rumus &amp; tips belajar.</p></div></div>`;
};
BIND.bot = () => {
  const chat = $("chat"); chat.scrollTop = chat.scrollHeight;
  const send = (v) => {
    v = (v || "").trim(); if(!v) return;
    D.chat.push({ who:"me", t:v });
    D.chat.push({ who:"bot", t:botReply(v) });
    if(D.chat.length > 40) D.chat = D.chat.slice(-40);
    save(); play("klik"); render(); $("b-in")?.focus();
  };
  $("b-send").onclick = () => send($("b-in").value);
  $("b-in").addEventListener("keydown", e => { if(e.key === "Enter") send($("b-in").value); });
  document.querySelectorAll("[data-bq]").forEach(b => b.onclick = () => send(b.dataset.bq));
  $("b-clear").onclick = () => { D.chat = [{ who:"bot", t:"Halo! 👋 Saya Teman Matematika Kelas X. Tanyakan rumus, tips belajar, atau minta contoh soal." }]; save(); render(); };
};

/* ================= SINKRON SPREADSHEET (Google Apps Script) ================= */
function gsPost(p){
  if(!D.gs || typeof fetch !== "function") return;
  try{
    fetch(`https://script.google.com/macros/s/${D.gs}/exec`, { method:"POST", body: JSON.stringify(p) }).catch(() => {});
  }catch(e){}
}
function gsNilai(opt, s){
  gsPost({ t:"nilai", nama: D.nama || "Murid", kelas: D.kelas || "X", sekolah: D.sekolah || "-",
    jenis: (opt && opt.title) || "Latihan", unit: (opt && opt.unit) || "-",
    skor: s, kktp: KKTP });
}
let gsProgresT = null;
function gsProgres(){
  if(!D.gs) return;
  clearTimeout(gsProgresT);
  gsProgresT = setTimeout(() => {
    const units = {};
    for(let n = 1; n <= 12; n++){
      const u = U(n);
      units[n] = { materi: !!u.materi, diag: u.diag > 0, form: u.form > 0, quiz: u.quiz > 0,
        refl: !!u.refl, proj: !!u.proj, meet: u.meet.every(Boolean) };
    }
    let labs = 0;
    for(const k in D.lab) if(D.lab[k]) labs++;
    gsPost({ t:"progres", nama: D.nama || "Murid", kelas: D.kelas || "X", sekolah: D.sekolah || "-",
      total: progAll(), units, ujian: D.ex, labs });
  }, 1500);
}

          `<button class="${D.tema===v?"on":""}" data-tema="${v}">${lb}</button>`).join("")}</div>
        <label class="chk"><input type="checkbox" id="s-snd" ${soundOn?"checked":""}> Efek suara saat menjawab</label></div>
      <div class="card pad"><div class="sec-h" style="margin-bottom:10px"><span class="ic">💾</span><h2 style="font-size:18px">Penyimpanan</h2></div>
        <p class="small muted">Progres disimpan otomatis di perangkat ini (<code class="formula">${LS_KEY}</code>).</p>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost" id="s-export">Salin progres (JSON)</button>
          <button class="btn ${resetArmed?"orange":""}" id="s-reset">${resetArmed?"⚠️ Klik lagi untuk hapus":"Reset progres"}</button></div></div>
    </div>
    <div class="card pad">
      <div class="sec-h" style="margin-bottom:10px"><span class="ic">🔗</span><h2 style="font-size:18px">Integrasi Google Sheets (opsional)</h2></div>
      <p class="small muted">Tempel kode Apps Script Web App (file <code class="formula">AppsScript-LMS.gs</code>) untuk mengirim nilai latihan &amp; progres murid ke Google Sheets guru. Dibiarkan kosong bila tidak dipakai.</p>
      <label class="f" style="margin-top:10px">Kode Web App<input type="text" id="s-gs" value="${esc(D.gs)}" placeholder="AKfycb..." ></label>
      <div class="sendbox ${D.gs?"":"off"}" style="margin-top:10px">
        <span>${D.gs?"🟢 Terhubung: siap mengirim skor":"⚪ Belum diatur — skor tersimpan lokal"}</span>
        <button class="btn sm ghost" id="s-gstest">Uji koneksi</button></div></div>
    <div class="card pad"><div class="sec-h" style="margin-bottom:8px"><span class="ic">ℹ️</span><h2 style="font-size:18px">Tentang</h2></div>
      <p class="small muted">LMS Matematika Kelas X · Fase E · dibangun selaras CP 4 elemen:
      Bilangan, Aljabar &amp; Fungsi, Geometri, Analisis Data &amp; Peluang. 12 unit · 144 JP · KKTP ${KKTP}.</p></div></div>`;
};
let resetArmed = false;
BIND.set = () => {
  $("s-save").onclick = () => {
    D.nama = $("s-nama").value.trim();
    D.kelas = $("s-kelas").value.trim() || "X";
    D.sekolah = $("s-sekolah").value.trim() || D.sekolah;
    save(); updateUser(); toast("Profil tersimpan ✅"); render(); };
  document.querySelectorAll("[data-tema]").forEach(b => b.onclick = () => {
    D.tema = b.dataset.tema; save(); theme(); render(); });
  $("s-snd").onchange = e => { soundOn = e.target.checked; D.snd = soundOn; save(); if(soundOn) play("benar"); };
  $("s-export").onclick = () => {
    const txt = localStorage.getItem(LS_KEY) || "{}";
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(()=>{});
    toast("Progres disalin ke clipboard 📋"); };
  $("s-gs").addEventListener("change", e => { D.gs = gsNorm(e.target.value); save(); render(); });
  $("s-gstest").onclick = () => {
    if(!D.gs) return toast("Isi kode Web App dulu");
    if(typeof fetch !== "function") return toast("Browser ini tidak mendukung fetch");
    toast("Mengirim uji… (cek tab jaringan)");
    fetch(`https://script.google.com/macros/s/${D.gs}/exec`, { method:"POST", body: JSON.stringify({ t:"uji" }) })
      .then(r => toast(r.ok ? "Terhubung ✅" : "Respons tidak OK")).catch(() => toast("Gagal terhubung — cek kode")); };
  const rb = $("s-reset");
  rb.onclick = () => {
    if(!resetArmed){ resetArmed = true; rb.textContent = "⚠️ Klik lagi untuk hapus"; rb.classList.add("orange");
      setTimeout(() => { resetArmed = false; if($("s-reset")){ $("s-reset").textContent = "Reset progres"; $("s-reset").classList.remove("orange"); } }, 4000);
      return; }
    D.u = {}; D.ex = { uts:0, uas:0, rem:0 }; D.g = {}; D.lab = {}; D.seq = {}; D.forum = null;
    D.chat = [{ who:"bot", t:"Halo! 👋 Saya Teman Matematika Kelas X. Tanyakan rumus, tips belajar, atau minta contoh soal." }];
    resetArmed = false; save(); toast("Progres direset"); go("home"); };
};

/* ================= INIT ================= */
function updateUser(){
  const nm = D.nama || "Murid Kelas X";
  $("userName").textContent = nm;
  $("userAv").textContent = initials(D.nama);
  $("userMeta").textContent = `Fase E · ${D.kelas || "X"}`;
}
function boot(){
  load();
  loadFromUrl();

  soundOn = D.snd !== false;
  updateUser();
  document.querySelectorAll('[data-act="go"]').forEach(b => b.onclick = () => { play("klik"); go(b.dataset.v); });

}
boot();
