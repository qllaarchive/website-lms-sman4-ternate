<style>
:root{
  --pai-deep:#052e2b; --pai-emerald:#0f766e; --pai-emerald2:#115e59;
  --pai-gold:#fbbf24; --pai-gold2:#d97706; --pai-mint:#ccfbf1; --pai-cream:#fffbeb;
  --bg:#f2f7f4; --card:#fffef8; --soft:#edf7f2; --line:#d5e3da; --ink:#17352d; --muted:#5b6f66;
  --navy:#064e3b; --navy2:#0f766e; --navy-ink:#d1fae5; --blue:#0f766e; --sun:#fbbf24;
  --e1:#0f766e; --e1bg:#d9f4ee; --e1line:#a7e3d8;
  --e2:#166534; --e2bg:#e2f5e8; --e2line:#b7e4c5;
  --e3:#b45309; --e3bg:#fef3c7; --e3line:#fde68a;
  --e4:#9a3412; --e4bg:#ffedd5; --e4line:#fed7aa;
  --e5:#a16207; --e5bg:#fef9c3; --e5line:#fde68a;
  --lab:#0f766e; --labbg:#d9f4ee; --labline:#a7e3d8;
  --good:#15803d; --goodbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 22px rgba(6,78,59,.08);
  --sj-accent:var(--pai-gold); --sj-gold:var(--pai-gold);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#081714; --card:#0f2420; --soft:#132f29; --line:#22443c; --ink:#ecfdf5; --muted:#9cc3b8;
  --navy:#041f1a; --navy2:#0f766e; --navy-ink:#d1fae5; --blue:#2dd4bf; --sun:#fbbf24;
  --e1:#5eead4; --e1bg:#0b3b34; --e1line:#1d6157;
  --e2:#86efac; --e2bg:#12331f; --e2line:#255b35;
  --e3:#fcd34d; --e3bg:#3b2a0c; --e3line:#6b4e12;
  --e4:#fdba74; --e4bg:#3b1d0d; --e4line:#6b3418;
  --e5:#fde047; --e5bg:#3b300c; --e5line:#6b5a12;
  --lab:#5eead4; --labbg:#0b3b34; --labline:#1d6157;
  --good:#4ade80; --goodbg:#0f2f1c; --bad:#ff8a8a; --badbg:#3a1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#081714; --card:#0f2420; --soft:#132f29; --line:#22443c; --ink:#ecfdf5; --muted:#9cc3b8;
  --navy:#041f1a; --navy2:#0f766e; --navy-ink:#d1fae5; --blue:#2dd4bf; --sun:#fbbf24;
  --e1:#5eead4; --e1bg:#0b3b34; --e1line:#1d6157;
  --e2:#86efac; --e2bg:#12331f; --e2line:#255b35;
  --e3:#fcd34d; --e3bg:#3b2a0c; --e3line:#6b4e12;
  --e4:#fdba74; --e4bg:#3b1d0d; --e4line:#6b3418;
  --e5:#fde047; --e5bg:#3b300c; --e5line:#6b5a12;
  --lab:#5eead4; --labbg:#0b3b34; --labline:#1d6157;
  --good:#4ade80; --goodbg:#0f2f1c; --bad:#ff8a8a; --badbg:#3a1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
body{background:radial-gradient(circle at 8% 0,rgba(15,118,110,.08),transparent 34%),radial-gradient(circle at 96% 12%,rgba(251,191,36,.07),transparent 30%),var(--bg)}
main{overflow-wrap:break-word}
#global-search-btn{display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:50%;font-size:0;line-height:1;background:rgba(255,251,235,.1)!important;color:#fef3c7!important;border:1px solid rgba(251,191,36,.45)!important;box-shadow:none!important;margin-left:auto!important;margin-right:0!important;flex-shrink:0}
#global-search-btn::before{content:"🔍";font-size:16px}
.top-in .user{width:180px;max-width:180px}
@media (min-width:821px){
  #global-search-btn{position:absolute;top:18px;right:204px;z-index:4;margin:0!important}
}
@media (max-width:820px){
  .top-in .user{width:auto;max-width:270px;margin-left:8px!important}
  #global-search-btn{margin-left:auto!important;margin-right:0!important}
}
.top{background:radial-gradient(circle at 82% 30%,rgba(251,191,36,.18),transparent 38%),linear-gradient(120deg,#041f1a 0%,#064e3b 48%,#0f766e 100%);color:#f0fdfa;border-bottom:3px solid var(--pai-gold);min-height:176px}
.brand h1{color:#fff!important;font-size:clamp(27px,3.4vw,44px);text-shadow:0 2px 10px rgba(0,0,0,.35)!important}
.brand h1 b{color:var(--pai-gold)!important}
.brand .sub{color:#a7f3d0!important;text-shadow:0 2px 8px rgba(0,0,0,.35)!important}
.brand .moto{color:#fefce8!important;text-shadow:0 2px 8px rgba(0,0,0,.35)!important}
.brand .moto i{color:var(--pai-gold)!important}
.scene::before{background:linear-gradient(90deg,#052e2b,rgba(5,46,43,0))!important}
@media (max-width:820px){.scene::before{display:none}}
.scene text{fill:#fef3c7!important;paint-order:stroke;stroke:rgba(5,46,43,.72);stroke-width:3px;stroke-linejoin:round;font-style:italic}
#sceneBox text{font-style:normal!important;letter-spacing:.08em;opacity:.92}
@media (max-width:349px){
  #global-search-btn{display:none!important}
}
@media (max-width:560px){
  .top-in{gap:8px}
  .brand{flex-shrink:1;min-width:0;gap:10px}
  .brand>div{min-width:0}
  .brand h1{font-size:21px;line-height:1.1;overflow-wrap:anywhere}
  .brand .sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .moto{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-logo{width:46px;height:42px}
  #sceneBox{display:none}
}
.user{background:var(--pai-cream)!important;color:#17352d!important;border:1px solid rgba(251,191,36,.55);box-shadow:0 8px 22px rgba(0,0,0,.24)!important}
.user .av{background:var(--pai-emerald)!important;color:#fff!important}
.user small{color:#5b6f66!important}
:root[data-theme="dark"] .user{background:#fffbeb!important;color:#17352d!important}
:root[data-theme="dark"] .user small{color:#5b6f66!important}
.side{background:linear-gradient(180deg,#083d33,#041f1a)!important;color:#d1fae5!important;border:1px solid rgba(251,191,36,.28);box-shadow:0 10px 30px rgba(4,31,26,.16)}
.nav button{color:#d1fae5!important}
.nav button:hover{background:rgba(251,191,36,.1)!important}
.nav button.on{background:var(--pai-gold)!important;color:#052e2b!important;box-shadow:0 5px 16px rgba(251,191,36,.26)!important}
.nav .new{background:var(--pai-gold)!important;color:#052e2b!important}
.side-moto{color:#f0fdfa!important}
.side-moto span{color:var(--pai-gold)!important}
.side-note{color:#9cc3b8!important;border-top-color:rgba(251,191,36,.26)!important}
.sec-h h2{color:#0f5f56}
:root[data-theme="dark"] .sec-h h2{color:var(--ink)!important}
.sec-h .ic{background:linear-gradient(145deg,#0f766e,#064e3b)!important;color:var(--pai-gold)!important;box-shadow:inset 0 0 0 1px rgba(251,191,36,.28)}
.welcome{background:linear-gradient(100deg,var(--e1bg),var(--card) 72%)!important}
.welcome h2{color:#0f5f56}
:root[data-theme="dark"] .welcome h2{color:var(--ink)!important}
.quote{border-color:var(--e3line)!important;color:#7c4a03!important;background:rgba(255,251,235,.65)}
:root[data-theme="dark"] .quote{color:#fef3c7!important;background:rgba(59,42,12,.35)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .sec-h h2,
  :root:not([data-theme="light"]) .welcome h2{color:var(--ink)!important}
  :root:not([data-theme="light"]) .quote{color:#fef3c7!important;background:rgba(59,42,12,.35)}
}
.btn{background:linear-gradient(135deg,#0f766e,#115e59)}
.btn:hover{filter:brightness(1.06)}
.btn.lab{background:linear-gradient(135deg,#0f766e,#0e7490)}
.btn.green{background:linear-gradient(135deg,#15803d,#166534)}
.btn.orange{background:linear-gradient(135deg,#b45309,#9a3412)}
.pill.e1{background:var(--e1bg);color:var(--e1);border-color:var(--e1line)}
.pill.e2{background:var(--e2bg);color:var(--e2);border-color:var(--e2line)}
.pill.e3{background:var(--e3bg);color:var(--e3);border-color:var(--e3line)}
.pill.e4{background:var(--e4bg);color:var(--e4);border-color:var(--e4line)}
.pill.e5{background:var(--e5bg);color:var(--e5);border-color:var(--e5line)}
.eacc-grid{display:flex;flex-direction:column;gap:12px}
.eacc{border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.eacc-h{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink);transition:background .16s var(--ease)}
.eacc-h:hover{background:var(--soft)}
.eacc-h .bub{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:23px;color:#fff;flex-shrink:0;border:3px solid var(--card)}
.eacc-t{flex:1;min-width:0}
.eacc-t small{display:block;font:800 12px var(--body);color:var(--muted)}
.eacc-t b{display:block;font:800 17px var(--display)}
.eacc-chev{font-size:18px;color:var(--muted);transition:transform .2s var(--ease)}
.eacc.open .eacc-chev{transform:rotate(180deg)}
.eacc-body{display:none;border-top:1px solid var(--line)}
.eacc.open .eacc-body{display:block}
.eacc.e1 .eacc-h{background:var(--e1bg)}
.eacc.e2 .eacc-h{background:var(--e2bg)}
.eacc.e3 .eacc-h{background:var(--e3bg)}
.eacc.e4 .eacc-h{background:var(--e4bg)}
.eacc.e5 .eacc-h{background:var(--e5bg)}
.eacc.e1 .bub{background:var(--e1)}
.eacc.e2 .bub{background:var(--e2)}
.eacc.e3 .bub{background:var(--e3)}
.eacc.e4 .bub{background:var(--e4)}
.eacc.e5 .bub{background:var(--e5)}
.eacc.e1 .eacc-t b{color:var(--e1)}
.eacc.e2 .eacc-t b{color:var(--e2)}
.eacc.e3 .eacc-t b{color:var(--e3)}
.eacc.e4 .eacc-t b{color:var(--e4)}
.eacc.e5 .eacc-t b{color:var(--e5)}
.eacc.e5{border-color:var(--e5line)}
.ucard.best{border-color:var(--e5line)!important}
.tabs button.on{background:var(--pai-gold)!important;color:#052e2b!important;border-color:var(--pai-gold)!important}
.card.pad:has(> #qbox:empty){display:none}
.ucard .boss{position:absolute;top:7px;right:32px;z-index:1;font:800 9px/1 var(--body);letter-spacing:.08em;background:var(--pai-gold);color:#052e2b;padding:3px 6px;border-radius:99px}
.match2 .ml{display:flex;flex-direction:column;gap:8px}
.match2 .mrow{width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:700 13px/1.35 var(--body);cursor:pointer;transition:border-color .16s var(--ease),background .16s var(--ease)}
.match2 .mrow:hover{border-color:var(--lab);background:var(--labbg)}
.match2 .mrow.on{border-color:var(--lab);background:var(--labbg);box-shadow:0 0 0 2px var(--labline)}
.match2 .mrow.ok{border-color:var(--good);background:var(--goodbg);color:var(--good);cursor:default}
.match2 .mrow:disabled{opacity:1}
.tlwrap{display:grid;gap:14px}
.tlpool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:14px;background:var(--soft);min-height:62px}
.tlchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font:800 13px/1.35 var(--body);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .14s var(--ease),border-color .14s var(--ease)}
.tlchip:hover{transform:translateY(-1px);border-color:var(--pai-gold)}
.tlchip.sel{outline:3px solid rgba(251,191,36,.35);border-color:var(--pai-gold)}
.tlrail{display:grid;gap:8px;position:relative;padding-left:28px}
.tlrail::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--pai-gold),var(--e3));border-radius:3px}
.tlslot{display:flex;align-items:center;gap:10px;min-height:50px;border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px;background:var(--card);position:relative;cursor:pointer;transition:background .15s,border-color .15s}
.tlslot::before{content:"";position:absolute;left:-25px;width:13px;height:13px;border-radius:50%;background:var(--pai-gold);border:3px solid var(--card)}
.tlslot.over{border-color:var(--pai-gold);background:var(--e3bg)}
.tlslot.ok{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.tlslot.no{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.tlslot .yr{font:800 13px var(--mono);color:var(--e3);min-width:64px}
.tlslot .ph{color:var(--muted);font:700 13px var(--body)}
.tlslot .tx{color:var(--ink);font:700 13px/1.35 var(--body)}
.tlslot .tlx{margin-left:auto;color:var(--muted);font-weight:800;font-size:12px}
.tswrap{display:grid;gap:14px}
.tsrange{width:100%;accent-color:var(--pai-emerald2);height:30px}
.tsyear{display:flex;justify-content:space-between;font:800 12px var(--mono);color:var(--muted);margin-top:-6px}
.tsera{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(120deg,var(--e2bg),var(--card));border:1.5px solid var(--e2line)}
.tsera .tsbig{font:800 34px/1 var(--display);color:var(--e2);font-variant-numeric:tabular-nums}
.tsera h4{font:800 18px var(--display)}
.tsera p{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.tscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tscard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);animation:fin .25s var(--ease)}
.tscard b{display:block;font:800 14.5px var(--display)}
.tscard small{color:var(--muted);font-weight:700;font-size:12px;display:block;margin-top:2px}
.tscard .yr{font:800 11.5px var(--mono);color:var(--e3)}
.tsempty{font:700 13.5px var(--body);color:var(--muted);padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
@media (max-width:640px){
  .tbl-wrap{position:relative}
  .tbl-wrap::before{content:"Geser tabel untuk melihat semua skor →";display:block;position:sticky;left:0;z-index:2;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);font:800 11px var(--body);color:var(--muted)}
  .tbl-wrap table{min-width:640px}
  .tbl-wrap th,.tbl-wrap td{padding:8px}
}
.ghero{background:linear-gradient(120deg,#041f1a,#0f766e 58%,#b45309)!important}
.ghero p{color:#ecfdf5!important}
.gbox,.rmplay{background:#041f1a!important}
.ghud,.rmplay-bar{background:#0b3b34!important}
.garena{background:radial-gradient(120% 100% at 80% 0,#0f3d35 0,#041f1a 62%)!important}
.g-track{background:linear-gradient(#0b3b34,#0f3d35)!important}
.g-card{background:linear-gradient(135deg,#115e59,#0f766e)!important}
.g-card.up{color:#052e2b!important}
.g-again{background:#ecfdf5!important;color:#052e2b!important}
.gicon{background:var(--labbg)!important}
.modal{background:rgba(4,31,26,.66)!important}
.mitem.on{box-shadow:0 0 0 3px rgba(15,118,110,.22)!important}
.rmthumb{background:linear-gradient(120deg,#041f1a,#0f766e)!important}
.rmplay{background:#041f1a!important}.rmplay-body{background:#041f1a!important}
.rmload{background:#041f1a!important;color:#d1fae5!important}
.rmplay-spin{border-top-color:var(--pai-gold)!important}
.tlslot::before{background:var(--pai-gold)!important}
.tlrail::before{background:linear-gradient(var(--pai-gold),var(--e3))!important}
.tlchip b,.tscard .yr,.mapinfo .yr{color:var(--e3)!important}
.tsrange{accent-color:var(--pai-emerald2)!important}
.mport:hover circle{fill:var(--e3)!important}
.mapwrap{background:linear-gradient(160deg,#e8f1e8,#f7f2dd)!important;border-color:var(--e5line)!important}
:root[data-theme="dark"] .mapwrap{background:linear-gradient(160deg,#0b1f1a,#16281f)!important}
</style>
