<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5ead0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a1f14">
<title>Sejarah LMS Kelas X — SMAN 4 Ternate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=EB+Garamond:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/lms.css">
<script>
(function(){ var t; try{ t = localStorage.getItem("lms_theme"); }catch(e){}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* ===== Tema Sejarah — parchment krem, nusantara, tanpa aksen biru ===== */
:root{
  --sj-cream:#f5ead0; --sj-cream2:#f0e2c0; --sj-cream3:#e8d4a8;
  --sj-ink:#3d2914; --sj-muted:#6b5434; --sj-faint:#8b7348;
  --sj-accent:#b85c38; --sj-red:#c92a2a; --sj-gold:#b8860b; --sj-gold2:#d4a017;
  --sj-side:#2c1e12; --sj-side2:#3d2914; --sj-side-ink:#f5e6c8;
  --sj-side-muted:#c9a86c; --sj-on:#c92a2a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sj-cream:#2a1f14; --sj-cream2:#33261a; --sj-cream3:#3d2914;
  --sj-ink:#f5e6c8; --sj-muted:#c9a86c; --sj-faint:#8b7348;
  --sj-accent:#e07a4f; --sj-red:#e05555; --sj-gold:#d4a017; --sj-gold2:#e8b830;
  --sj-side:#1a120b; --sj-side2:#2a1f14; --sj-side-ink:#f5e6c8;
  --sj-side-muted:#a08050; --sj-on:#e05555;
}}
:root[data-theme="dark"]{
  --sj-cream:#2a1f14; --sj-cream2:#33261a; --sj-cream3:#3d2914;
  --sj-ink:#f5e6c8; --sj-muted:#c9a86c; --sj-faint:#8b7348;
  --sj-accent:#e07a4f; --sj-red:#e05555; --sj-gold:#d4a017; --sj-gold2:#e8b830;
  --sj-side:#1a120b; --sj-side2:#2a1f14; --sj-side-ink:#f5e6c8;
  --sj-side-muted:#a08050; --sj-on:#e05555;
}

/* Peta warna dasar → coklat/emas */
:root{
  --bg:#f3ead8; --card:#fffaf0; --soft:#f7efdd; --line:#e0cfae;
  --ink:#3d2914; --muted:#6b5434;
  --navy:#3d2914; --navy2:#5a3d20; --navy-ink:#f5e6c8; --blue:#b85c38; --sun:#d4a017;
  --e1:#b85c38; --e1bg:#f6e3d8; --e1line:#e5c3ad;
  --e2:#b8860b; --e2bg:#f7edd2; --e2line:#e6d19a;
  --e3:#7a8b3c; --e3bg:#eef0d8; --e3line:#d6dcb0;
  --e4:#8b5e3c; --e4bg:#f0e6da; --e4line:#dcc7b0;
  --lab:#a0602e; --labbg:#f3e6d3; --labline:#ddc5a2;
  --good:#4f7d32; --goodbg:#e7f0d6; --bad:#b3392f; --badbg:#f8e2dc;
  --shadow:0 1px 2px rgba(61,41,20,.06),0 6px 18px rgba(61,41,20,.09);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a120b; --card:#241a10; --soft:#2c2114; --line:#4a3826;
  --ink:#f5e6c8; --muted:#c9a86c;
  --navy:#2a1f14; --navy2:#3d2914; --navy-ink:#f5e6c8; --blue:#e0a25a; --sun:#e8b830;
  --e1:#e07a4f; --e1bg:#3a2418; --e1line:#5c3a26;
  --e2:#d4a017; --e2bg:#3a2f16; --e2line:#5c4a20;
  --e3:#a3b060; --e3bg:#2a2f1a; --e3line:#454c2a;
  --e4:#c08a5e; --e4bg:#33261a; --e4line:#4f3a26;
  --lab:#d09a5e; --labbg:#33261a; --labline:#4f3a26;
  --good:#7fbf6a; --goodbg:#22301a; --bad:#ff8a7a; --badbg:#3a1d18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1a120b; --card:#241a10; --soft:#2c2114; --line:#4a3826;
  --ink:#f5e6c8; --muted:#c9a86c;
  --navy:#2a1f14; --navy2:#3d2914; --navy-ink:#f5e6c8; --blue:#e0a25a; --sun:#e8b830;
  --e1:#e07a4f; --e1bg:#3a2418; --e1line:#5c3a26;
  --e2:#d4a017; --e2bg:#3a2f16; --e2line:#5c4a20;
  --e3:#a3b060; --e3bg:#2a2f1a; --e3line:#454c2a;
  --e4:#c08a5e; --e4bg:#33261a; --e4line:#4f3a26;
  --lab:#d09a5e; --labbg:#33261a; --labline:#4f3a26;
  --good:#7fbf6a; --goodbg:#22301a; --bad:#ff8a7a; --badbg:#3a1d18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
.modal{background:rgba(26,18,11,.6)!important}
.mitem.on{box-shadow:0 0 0 3px rgba(184,92,56,.2)!important}
.ghero{background:linear-gradient(120deg,var(--sj-side2),#5a3d20 55%,var(--sj-accent))!important}
.ghero p{color:#f0e2c0!important}
.gbox{background:#1a120b!important;box-shadow:0 10px 30px rgba(0,0,0,.45)!important}
.ghud{background:#2a1f14!important}
.garena{background:radial-gradient(120% 100% at 80% 0,#3d2914 0,#1a120b 60%)!important}
.g-kicker,.g-prompt small,.g-prog{color:#d4b483!important}
.g-track{background:linear-gradient(#241a10,#3d2914)!important}
.g-track::before{background-image:radial-gradient(#f5e6c8 1px,transparent 1.5px)!important;opacity:.18!important}
.g-card{background:linear-gradient(135deg,#7a4a20,#b85c38)!important}
.g-card.up{color:#3d2914!important}
.g-bubble{color:#3d2914!important}
.g-again{background:#f5e6c8!important;color:#3d2914!important}
.gstars{color:var(--sj-gold2)!important}
.gicon{background:var(--labbg)!important}
.rmthumb{background:linear-gradient(120deg,var(--sj-side2),var(--sj-accent))!important}
.rmplay{background:#1a120b!important}.rmplay-bar{background:#2a1f14!important}
.rmplay-body{background:#1a120b!important}.rmload{background:#1a120b!important;color:#e8d4a8!important}
.rmplay-spin{border-top-color:var(--sj-gold2)!important}
.top{background:linear-gradient(120deg,var(--sj-cream) 0%,var(--sj-cream2) 45%,var(--sj-cream3) 100%);color:var(--sj-ink);border-bottom:3px solid var(--sj-gold)}
.brand h1{color:var(--sj-ink)!important;text-shadow:none!important}
.brand h1 b{color:var(--sj-red)!important}
.brand .sub{color:var(--sj-muted)!important;text-shadow:none!important}
.brand .moto{color:var(--sj-ink)!important;text-shadow:none!important}
.brand .moto i{color:var(--sj-gold2)!important}
.scene::before{background:linear-gradient(90deg,var(--sj-cream),rgba(245,234,208,0))!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scene::before{background:linear-gradient(90deg,var(--sj-cream),rgba(42,31,20,0))!important}}
:root[data-theme="dark"] .scene::before{background:linear-gradient(90deg,var(--sj-cream),rgba(42,31,20,0))!important}
.scene text{fill:var(--sj-ink)!important;paint-order:stroke;stroke:rgba(245,234,208,.8);stroke-width:3px;stroke-linejoin:round;font-style:italic}
:root[data-theme="dark"] .scene text{stroke:rgba(42,31,20,.85)}
.user{background:#fff!important;color:#3d2914!important;box-shadow:0 8px 20px rgba(61,41,20,.2)!important}
:root[data-theme="dark"] .user{background:#f5e6c8!important;color:#2a1f14!important}
.user .av{background:var(--sj-red)!important;color:#fff!important}
.user small{color:#6b5434!important}
:root[data-theme="dark"] .user small{color:#5a4530!important}
.side{background:linear-gradient(180deg,var(--sj-side2),var(--sj-side))!important;color:var(--sj-side-ink)!important;border:1px solid rgba(212,160,23,.25)}
.nav button{color:#e8d4a8!important}
.nav button:hover{background:rgba(212,160,23,.12)!important}
.nav button.on{background:var(--sj-red)!important;color:#fff!important;box-shadow:0 4px 12px rgba(201,42,42,.4)!important}
.nav .new{background:var(--sj-gold2)!important;color:#2c1e12!important}
.side-moto{color:#f5e6c8!important}
.side-moto span{color:var(--sj-gold2)!important}
.side-note{color:var(--sj-side-muted)!important;border-top-color:rgba(212,160,23,.25)!important}
.sec-h h2{color:var(--sj-ink)}
.sec-h .ic{background:var(--sj-side2);color:var(--sj-gold2)}

/* Lab: Accordion Learning Path */
.eacc-grid{display:flex;flex-direction:column;gap:12px}
.eacc{border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.eacc-h{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink);transition:background .16s var(--ease)}
.eacc-h:hover{background:var(--soft)}
.eacc-h .bub{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:23px;color:#fff;flex-shrink:0;border:3px solid var(--card)}
.eacc-t{flex:1;min-width:0}
.eacc-t small{display:block;font:800 12px var(--body);color:var(--muted)}
.eacc-t b{display:block;font:800 17px var(--display)}
.eacc-chev{font-size:18px;color:var(--muted);transition:transform .2s var(--ease)}
.eacc.open .eacc-chev{transform:rotate(180deg)}
.eacc-body{display:none;border-top:1px solid var(--line)}
.eacc.open .eacc-body{display:block}
.eacc.e1 .eacc-h{background:var(--e1bg)}
.eacc.e2 .eacc-h{background:var(--e2bg)}
.eacc.e3 .eacc-h{background:var(--e3bg)}
.eacc.e4 .eacc-h{background:var(--e4bg)}
.eacc.e1 .bub{background:var(--e1)}
.eacc.e2 .bub{background:var(--e2)}
.eacc.e3 .bub{background:var(--e3)}
.eacc.e4 .bub{background:var(--e4)}
.eacc.e1 .eacc-t b{color:var(--e1)}
.eacc.e2 .eacc-t b{color:var(--e2)}
.eacc.e3 .eacc-t b{color:var(--e3)}
.eacc.e4 .eacc-t b{color:var(--e4)}

/* Lab: Timeline kronologi */
.tlwrap{display:grid;gap:14px}
.tlpool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:14px;background:var(--soft);min-height:62px}
.tlchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font:800 13.5px var(--body);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .14s var(--ease),border-color .14s var(--ease)}
.tlchip:hover{transform:translateY(-1px);border-color:var(--sj-gold)}
.tlchip.sel{outline:3px solid var(--sj-gold);border-color:var(--sj-gold)}
.tlchip b{color:var(--sj-accent);font-variant-numeric:tabular-nums}
.tlrail{display:grid;gap:8px;position:relative;padding-left:28px}
.tlrail::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--sj-gold),var(--sj-accent));border-radius:3px}
.tlslot{display:flex;align-items:center;gap:10px;min-height:50px;border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px;background:var(--card);position:relative;cursor:pointer;transition:background .15s,border-color .15s}
.tlslot::before{content:"";position:absolute;left:-25px;width:13px;height:13px;border-radius:50%;background:var(--sj-gold);border:3px solid var(--card)}
.tlslot.over{border-color:var(--sj-gold);background:var(--e2bg)}
.tlslot.ok{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.tlslot.no{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.tlslot .yr{font:800 13px var(--mono);color:var(--sj-accent);min-width:64px}
.tlslot .ph{color:var(--muted);font:700 13px var(--body)}
.tlslot .tlx{margin-left:auto;color:var(--muted);font-weight:800;font-size:12px}

/* Lab: Sortir sumber */
.binwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.binwrap{grid-template-columns:1fr}}
.bin{border:2px dashed var(--line);border-radius:16px;padding:12px;background:var(--soft);min-height:150px;transition:background .15s,border-color .15s}
.bin h4{font:800 15px var(--display);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.bin .cnt{margin-left:auto;font:800 12px var(--body);color:var(--muted)}
.bin.over{border-color:var(--sj-gold);background:var(--e2bg)}
.bin .bitems{display:flex;flex-wrap:wrap;gap:6px}
.schip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font:700 13px var(--body);color:var(--ink);cursor:pointer;transition:transform .14s,border-color .14s}
.schip:hover{border-color:var(--sj-gold);transform:translateY(-1px)}
.schip.sel{outline:3px solid var(--sj-gold);border-color:var(--sj-gold)}
.schip.ok{background:var(--goodbg);border-color:var(--good);color:var(--good);cursor:default;animation:fin .2s var(--ease)}
.schip.no{animation:gbad .45s}
.binpool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);min-height:58px}

/* Lab: Peta jalur rempah */
.mapwrap{position:relative;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:linear-gradient(160deg,#efe0bd,#f7eeda)}
:root[data-theme="dark"] .mapwrap{background:linear-gradient(160deg,#2a1f14,#1a120b)}
.mapwrap svg{display:block;width:100%;height:auto}
.mport{cursor:pointer}
.mport circle{transition:fill .15s,r .15s}
.mport:hover circle{fill:var(--sj-red);r:12}
.mport.visited circle{fill:var(--good)}
.mport text{font:800 11px var(--body);fill:#4a3a22;paint-order:stroke;stroke:rgba(247,238,218,.95);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mapinfo{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-top:12px}
.mapinfo .mi-em{font-size:30px;line-height:1}
.mapinfo h4{font:800 17px var(--display)}
.mapinfo p{font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.5;margin-top:2px}
.mapinfo .yr{font:800 11.5px var(--mono);color:var(--sj-accent)}
.mapcheck{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font:800 12px var(--body);color:var(--muted)}
.mapdot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.mapdot.on{background:var(--good)}

/* Lab: Mesin waktu */
.tswrap{display:grid;gap:14px}
.tsrange{width:100%;accent-color:var(--sj-accent);height:30px}
.tsyear{display:flex;justify-content:space-between;font:800 12px var(--mono);color:var(--muted);margin-top:-6px}
.tsera{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(120deg,var(--e1bg),var(--card));border:1.5px solid var(--e1line)}
.tsera .tsbig{font:800 34px/1 var(--display);color:var(--e1);font-variant-numeric:tabular-nums}
.tsera h4{font:800 18px var(--display)}
.tsera p{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.tscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tscard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);animation:fin .25s var(--ease)}
.tscard b{display:block;font:800 14.5px var(--display)}
.tscard small{color:var(--muted);font-weight:700;font-size:12px;display:block;margin-top:2px}
.tscard .yr{font:800 11.5px var(--mono);color:var(--sj-accent)}
.tsempty{font:700 13.5px var(--body);color:var(--muted);padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}

/* Gim HUD & feedback (sejarah variant) */
.ghud{align-items:center;gap:10px 14px}
.ghud .ghud-l{display:flex;flex-direction:column;gap:5px;min-width:180px;flex:1}
.gprog{height:7px;border-radius:99px;background:rgba(245,230,200,.16);overflow:hidden}
.gprog i{display:block;height:100%;background:linear-gradient(90deg,var(--sj-gold),var(--sj-accent));border-radius:99px;transition:width .45s var(--ease)}
.gcombo{color:#ffd84d;font:800 13px var(--body);white-space:nowrap}
.garena{position:relative}
.gfb{display:flex;gap:8px;align-items:center;margin-top:12px;padding:9px 12px;border-radius:10px;font:800 13.5px var(--body);animation:fin .2s var(--ease)}
.gfb.ok{background:rgba(127,191,106,.16);color:#a8d98e;border:1px solid rgba(127,191,106,.4)}
.gfb.no{background:rgba(255,138,122,.14);color:#ffb3a8;border:1px solid rgba(255,138,122,.35)}
.gconfetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.gconfetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:gfall 1.7s linear forwards}
@keyframes gfall{to{transform:translateY(460px) rotate(720deg);opacity:.15}}
.gstars .pop{display:inline-block;animation:starPop .55s var(--ease) both}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.gcard .gprogline{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.gcard .gprogline i{display:block;height:100%;background:linear-gradient(90deg,var(--sj-gold),var(--sj-accent));border-radius:99px}
.ucard .boss{position:absolute;top:6px;right:26px;font:800 10px var(--body);background:var(--sj-red);color:#fff;padding:2px 7px;border-radius:99px;letter-spacing:.04em}
.ucard.best{border-color:var(--sj-gold)}
</style>

<body>
<header class="top">
  <div class="top-in gut">
    <div class="brand">
      <a class="go-home" href="../index.html" aria-label="Balik ke beranda" title="Balik ke beranda" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>

      <svg class="brand-logo" viewBox="0 0 74 66" aria-hidden="true">
        <rect x="4" y="6" width="66" height="54" rx="10" fill="#fff" opacity=".14"/>
        <rect x="4" y="6" width="66" height="54" rx="10" fill="none" stroke="#ffc531" stroke-width="3"/>
        <path d="M14 48 Q28 14 44 40 T64 22" fill="none" stroke="#ffc531" stroke-width="4" stroke-linecap="round"/>
        <circle cx="44" cy="40" r="4" fill="#fff"/>
        <text x="14" y="30" font-size="15" fill="#dfe8ff" font-family="serif" font-style="italic" id="brandLogoText">📜</text>
      </svg>
      <div>
        <h1 id="brandTitle">LMS <b>Kelas X</b></h1>
        <div class="sub" id="brandSub">Kelas X · SMAN 4 Ternate</div>
        <div class="moto" id="brandMoto"></div>
      </div>
    </div>
    <button class="user" data-act="go" data-v="set">
      <span class="av" id="userAv">M</span>
      <span class="who"><b id="userName">Murid Kelas X</b><small id="userMeta">Fase E · Semester Genap</small></span>
    </button>
  </div>
  <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 1100 176" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sjGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f3ead8"/>
            <stop offset=".55" stop-color="#f5ead0"/>
            <stop offset="1" stop-color="#e8d4a8"/>
          </linearGradient>
          <pattern id="parch" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M20 0h1.2M0 20h1.2M20 40h1.2" stroke="#d4b483" stroke-width="0.5" opacity="0.35"/>
            <path d="M0 10h40M10 0v40" stroke="#e0cfae" stroke-width="0.5" opacity="0.2"/>
          </pattern>
        </defs>
        <rect width="1100" height="176" fill="url(#sjGrad)"/>
        <rect width="1100" height="176" fill="url(#parch)" opacity="0.45"/>
