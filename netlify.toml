# Netlify config — deploy website portal saja (tanpa database)
[build]
  publish = "."
  command = "node scripts/build-config.mjs"

# Inject API URL dari environment variable
[build.environment]
  LMS_API_BASE = "/api"

# Redirect /api/* ke backend (Render / Railway / VPS)
# Ganti https://lms-api.onrender.com dengan URL API kamu
[[redirects]]
  from = "/api/*"
  to = "https://lms-api.onrender.com/api/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
