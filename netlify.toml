[build]
  # Situs statis (portal + halaman mapel) ada di folder public/
  publish = "public"
  command = "node scripts/build-config.mjs"

[build.environment]
  # Repo ini punya dependensi `next`, tapi yang dideploy ke Netlify hanya situs
  # statis di public/. Matikan plugin Next.js otomatis agar build tidak gagal.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com;"

[[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
  Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[redirects]]
  from = "/api/*"
  to = "https://lms-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
