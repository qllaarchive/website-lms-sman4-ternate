<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sejarah LMS Kelas X — SMAN 4 Ternate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=EB+Garamond:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/lms.css">
<script>
/* Samakan tema dengan portal (lms_theme) sebelum paint. */
(function(){ var t; try{ t = localStorage.getItem("lms_theme"); }catch(e){}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
</head>
<body>
<header class="top">
  <div class="top-in gut">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 74 66" aria-hidden="true">
        <rect x="4" y="6" width="66" height="54" rx="10" fill="#fff" opacity=".14"/>
        <rect x="4" y="6" width="66" height="54" rx="10" fill="none" stroke="#ffc531" stroke-width="3"/>
        <path d="M26 16 v-2 a4 4 0 0 1 4 -2 h18 a4 4 0 0 1 4 2 v2" fill="none" stroke="#ffc531" stroke-width="3" stroke-linecap="round"/>
        <rect x="22" y="16" width="30" height="34" rx="3" fill="none" stroke="#ffc531" stroke-width="3"/>
        <path d="M28 26 h18 M28 33 h18 M28 40 h11" stroke="#dfe8ff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div>
        <h1 id="brandTitle" style="cursor:pointer" onclick="location.href='index.html'" title="Kembali ke portal">LMS <b>Kelas X</b></h1>
        <div class="sub" id="brandSub">Kelas X · SMAN 4 Ternate</div>
        <div class="moto" id="brandMoto"></div>
      </div>
    </div>
    <button class="user" data-act="go" data-v="set">
      <span class="av" id="userAv">M</span>
      <span class="who"><b id="userName">Murid Kelas X</b><small id="userMeta">Fase E · Semester Genap</small></span>
    </button>
  </div>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1100 176" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="grid" width="1100" height="34" patternUnits="userSpaceOnUse">
          <path d="M0 33.5H1100" fill="none" stroke="#3f63b8" stroke-width="1" opacity=".4"/>
        </pattern>
        <linearGradient id="fade" x1="0" x2="1">
          <stop offset="0" stop-color="#0e2a6e"/><stop offset=".55" stop-color="#0e2a6e" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect width="1100" height="176" fill="url(#grid)" opacity=".55"/>
      <path d="M-10 120 C 150 60 300 140 450 96 S 760 40 900 92 S 1050 130 1110 108" fill="none" stroke="#ffc531" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      <g id="sceneBox"></g>
      <rect width="1100" height="176" fill="url(#fade)"/>
    </svg>
  </div>
</header>

<div class="app gut">
  <aside class="side">
    <nav class="nav" id="nav" aria-label="Menu utama"></nav>
    <div class="side-moto" id="sideMoto"></div>
    <div class="side-note" id="sideNote"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script src="data/sejarah.js"></script>
<script src="assets/lms.js"></script>
</body>
</html>
