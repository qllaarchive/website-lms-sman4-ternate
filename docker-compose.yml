version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: ./api/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  portal:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./portal-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata: